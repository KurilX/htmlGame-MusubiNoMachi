name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify single-file constraints
        run: |
          set -e
          FILE=game.html
          test -f "$FILE" || { echo "ERROR: game.html missing"; exit 1; }
          SIZE=$(stat -c%s "$FILE")
          echo "game.html size: $SIZE bytes"
          test "$SIZE" -gt 500000 || { echo "ERROR: file too small"; exit 1; }

          if grep -qiE '<script[^>]+src=' "$FILE"; then
            echo "ERROR: external script tag found"; exit 1
          fi
          if grep -qiE '(src|href)="https?://' "$FILE"; then
            echo "ERROR: external http resource found"; exit 1
          fi
          BAD_LINK=$(grep -iE '<link[^>]+href=' "$FILE" | grep -viE 'href="data:' || true)
          if test -n "$BAD_LINK"; then
            echo "ERROR: external stylesheet found"; exit 1
          fi
          grep -q 'REVISION' "$FILE" || { echo "ERROR: three.js not inlined"; exit 1; }
          grep -q 'window.G = window.G' "$FILE" || { echo "ERROR: game modules not inlined"; exit 1; }
          echo "OK: all single-file constraints satisfied"

      - name: Prepare site
        run: |
          set -e
          mkdir -p _site
          cp game.html _site/game.html
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<html lang="zh-CN"><head><meta charset="utf-8">' \
            '<meta name="viewport" content="width=device-width,initial-scale=1">' \
            '<title>結ノ町 — Musubi no Machi</title>' \
            '<style>html,body{margin:0;height:100%;background:#14161c;color:#F7C8D8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}' \
            'h1{font-size:28px;letter-spacing:8px;font-weight:400;margin:0}' \
            'p{color:#8a99a8;font-size:13px;margin:0;letter-spacing:1px}' \
            'a{display:inline-block;padding:12px 34px;border:1px solid rgba(247,200,216,.5);border-radius:6px;color:#FBF3E4;text-decoration:none;font-size:15px;letter-spacing:2px}' \
            'a:hover{background:rgba(247,200,216,.13);border-color:#F7C8D8}' \
            '.hint{color:#5c6672;font-size:11px;margin-top:8px}</style></head>' \
            '<body><h1>結 ノ 町</h1><p>Musubi no Machi</p>' \
            '<a href="./game.html">开 始 游 戏</a>' \
            '<div class="hint">WASD 移动 · 左键攻击 · 1-4 技能 · Shift 闪避 · E 交互</div>' \
            '</body></html>' > _site/index.html
          cp _site/index.html _site/404.html
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
