<script>
/* 51-terrain.js — 地形高度场
 *
 * 设计原则（很重要）：
 *  1) 高度必须是一个**纯函数** h(x,z)，任何模块随时可查，不需要查询网格。
 *  2) 城镇区域保持绝对平坦（h=0）——城镇是安全区，台阶/坡度会让 NPC 和
 *     建筑对位变得脆弱，且视觉上城镇平整更像"人工聚落"。
 *  3) 野外用几个"地形骨架"叠加：缓坡 + 溪谷下切 + 远处高地。
 *  4) 高度函数必须是**连续可导**的（smoothstep 过渡），否则实体会在
 *     硬边处"跳"一格。
 */
(function (G) {
  'use strict';

  var T = G.terrain = {};

  // 城镇范围（沿用 DATA.TOWN 的边界，向内收 2 单位作为过渡带）
  var TOWN_PAD = 2.5;

  /**
   * 城镇权重 0..1。
   * 城镇内 = 1（完全平整），过渡带内平滑衰减到 0。
   */
  function townWeight(x, z) {
    var D = G.DATA.TOWN;
    // 到城镇矩形边界的有符号距离（内部为正）
    var dx = Math.min(x - D.minX, D.maxX - x);
    var dz = Math.min(z - D.minZ, D.maxZ - z);
    var d = Math.min(dx, dz);
    if (d <= 0) return 0;                       // 城外
    if (d >= TOWN_PAD) return 1;                // 城内深处
    return G.M.smoothstep(d / TOWN_PAD);        // 过渡带
  }

  /**
   * 野外基础起伏：从城镇边界往北缓升，配合两道横向的"坡坎"。
   */
  function fieldHeight(x, z) {
    // 北高南低：越往副本方向越高
    var rise = G.M.clamp01((z - 12) / 54) * 6.2;

    // 第一道坡坎：z≈26，缓坡
    var step1 = G.M.smoothstep((z - 22) / 8) * 1.5;

    // 第二道坡坎：z≈48，更陡
    var step2 = G.M.smoothstep((z - 44) / 7) * 2.4;

    // 东西两侧略微抬升（盆地感，中间是走道）
    var bowl = Math.pow(Math.abs(x) / 34, 2.2) * 2.8;

    // 细微噪声（用两个不同频率的正弦代替，避免引入额外随机性）
    var wobble = Math.sin(x * 0.21) * Math.cos(z * 0.17) * 0.35
               + Math.sin(x * 0.53 + 1.7) * 0.12;

    return rise + step1 + step2 + bowl + wobble;
  }

  /**
   * 溪谷下切：沿 x≈-22 的一条南北向沟。
   * 用平滑的谷形（不是 V 字），并让水面高度跟随。
   */
  var RIVER = { centerX: -22, halfWidth: 3.6, depth: 2.2, zMin: 14, zMax: 56 };

  function riverCarve(x, z) {
    if (z < RIVER.zMin || z > RIVER.zMax) return 0;
    var dx = Math.abs(x - RIVER.centerX);
    if (dx > RIVER.halfWidth) return 0;
    // 谷形：中心最深，边缘平滑到 0
    var t = 1 - dx / RIVER.halfWidth;
    var shape = G.M.smoothstep(t);
    // 南北两端淡出
    var zFade = Math.min(
      G.M.smoothstep((z - RIVER.zMin) / 3),
      G.M.smoothstep((RIVER.zMax - z) / 3)
    );
    return -RIVER.depth * shape * zFade;
  }

  /**
   * 主高度函数。
   * @returns {number} 世界 y（地面表面）
   */
  T.height = function (x, z) {
    var tw = townWeight(x, z);
    // 城镇内强制 0；过渡带内插值
    var field = fieldHeight(x, z) + riverCarve(x, z);
    return field * (1 - tw);
  };

  /** 地面法线（用于让物体贴合坡面，目前只用于立绘的轻微倾斜） */
  T.slope = function (x, z) {
    var e = 0.5;
    var hl = T.height(x - e, z), hr = T.height(x + e, z);
    var hd = T.height(x, z - e), hu = T.height(x, z + e);
    return {
      dx: (hr - hl) / (2 * e),
      dz: (hu - hd) / (2 * e)
    };
  };

  /** 坡度大小 0..~（0=平地） */
  T.steepness = function (x, z) {
    var s = T.slope(x, z);
    return Math.sqrt(s.dx * s.dx + s.dz * s.dz);
  };

  /** 河流中心线（供水面与碰撞使用） */
  T.river = RIVER;

  /** 水面高度：溪谷中心的固定水位 */
  T.waterLevel = function () {
    return -1.15;
  };

  /** 判断某点是否在水下（用于减速） */
  T.isUnderwater = function (x, z) {
    return T.height(x, z) < T.waterLevel();
  };

})(window.G = window.G || {});

</script>

<script>
/* 50-world.js — 世界构建与运行时
 *
 * 职责：把 data/zones.js 的声明式数据变成真实的 three.js 场景。
 * 所有"世界变更"都走 dispatch(intent)（见 90-arch.js），这里只负责构建与查询。
 */
(function (G) {
  'use strict';

  var M = G.M;

  var W = G.world = {
    scene: null,
    sun: null,
    ambient: null,
    ground: null,
    props: [],
    colliders: [],
    interactables: [],
    npcs: [],
    enemies: [],
    spawnZones: [],
    timeOfDay: 0.32,          // 0..1，0.32 = 早晨
    dayLengthSec: 20 * 60,    // 20 分钟一天
    dayCount: 0,
    inDungeon: false,
    dungeonRoom: 0,
    ambientShaderTime: 0
  };

  // =====================================================================
  // 昼夜判定（必须在 build 之前定义：buildNPCs 里会调用 isNight）
  // =====================================================================
  // timeOfDay: 0 = 午夜, 0.25 = 6:00 日出, 0.5 = 正午, 0.75 = 18:00 日落
  var DAWN = 0.24, DUSK = 0.76;
  var TRANS = 0.07;

  W.isNight = function () {
    var t = W.timeOfDay;
    return t < DAWN || t > DUSK;
  };

  /**
   * 夜色程度 0..1。0 = 正午全亮，1 = 深夜。
   * 踩过的坑：最初写反过，导致 07:41 显示月亮图标、白天画面像黄昏。
   */
  W.nightFactor = function () {
    var t = W.timeOfDay;
    if (t < DAWN - TRANS) return 1;                       // 深夜
    if (t < DAWN) return (DAWN - t) / TRANS;              // 黎明前
    if (t < DAWN + TRANS) return 1 - (t - DAWN) / TRANS;  // 日出
    if (t < DUSK - TRANS) return 0;                       // 白天
    if (t < DUSK) return (t - (DUSK - TRANS)) / TRANS;    // 入夜
    if (t < DUSK + TRANS) return 0.5 + ((t - DUSK) / TRANS) * 0.5;
    return 1;
  };

  /** 黄昏/黎明程度（用于染色）0..1 */
  W.duskFactor = function () {
    var t = W.timeOfDay;
    var a = 0;
    if (t > DAWN - TRANS && t < DAWN + TRANS) {
      a = 1 - Math.abs(t - DAWN) / TRANS;
    }
    if (t > DUSK - TRANS && t < DUSK + TRANS) {
      a = Math.max(a, 1 - Math.abs(t - DUSK) / TRANS);
    }
    return G.M.clamp01(a);
  };

  // =====================================================================
  // 构建
  // =====================================================================
  W.build = function () {
    var scene = new THREE.Scene();
    W.scene = scene;
    // 天空色（按时间）
    scene.background = new THREE.Color(G.PALETTE.sky);
    // 雾：起点必须远大于相机到玩家的距离（相机距离 34），
    // 否则整个画面糊成一片（踩过：near=34 时全屏发灰）
    scene.fog = new THREE.Fog(new THREE.Color('#D9E4EA'), 62, 105);

    // ---- 光照 ----
    // 结构说明（调色时最容易被误判的一段）：
    //   AmbientLight  只给整体一个常数亮度，对 Toon 的"暗部"几乎无帮助
    //   HemisphereLight 天空色打顶、地面色打底，才能真正把背光面提亮
    // 踩过的坑：只靠 Ambient + Directional 时，五重塔背光面被 Toon 暗部
    // 压成深红，看上去像"颜色调错了"，实际是补光不足。
    var ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    W.ambient = ambient;

    var hemi = new THREE.HemisphereLight(0xDCEAF2, 0xB8C89A, 0.62);
    scene.add(hemi);
    W.hemi = hemi;

    var sun = new THREE.DirectionalLight(0xfff6e8, 1.62);
    sun.position.set(16, 26, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    var d = 42;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 130;
    sun.shadow.bias = -0.0012;
    sun.shadow.normalBias = 0.03;
    scene.add(sun);
    scene.add(sun.target);
    W.sun = sun;

    // 补光（让背光面不至于太死）
    var fill = new THREE.DirectionalLight(0xB8DCE8, 0.42);
    fill.position.set(-18, 12, -16);
    scene.add(fill);
    W.fill = fill;

    // ---- 地面 ----
    // 2026-11 改造：原来是两块纯平 BoxGeometry，野外看起来空旷。
    // 现在按 G.terrain.height(x,z) 生成分段网格，支持坡坎/溪谷/盆地。
    // 城镇区域高度恒为 0（terrain 内部用 townWeight 强制），所以城镇仍是平的。
    W.ground = [];

    function buildGroundMesh(opts) {
      // opts: {minX,maxX,minZ,maxZ,segX,segZ,color,repeat,seed}
      var geo = new THREE.PlaneGeometry(
        opts.maxX - opts.minX,
        opts.maxZ - opts.minZ,
        opts.segX, opts.segZ
      );
      geo.rotateX(-Math.PI / 2);

      // 把顶点按高度场抬高，并给顶点色做明暗层次
      var pos = geo.attributes.position;
      var colors = new Float32Array(pos.count * 3);
      var cx = (opts.minX + opts.maxX) / 2;
      var cz = (opts.minZ + opts.maxZ) / 2;
      // 注意：贴图本身已经是 opts.color 了，材质 color 是白色。
      // 所以顶点色必须是**围绕白色**的乘数（0.86~1.10），
      // 不能再用 baseCol 去乘，否则 map x color x vertexColor 三重相乘，
      // 草地会变成暗黄橄榄色（踩过一次完全一样的坑）。
      var darkMul = 0.86;
      var lightMul = 1.10;

      for (var i = 0; i < pos.count; i++) {
        var wx = pos.getX(i) + cx;
        var wz = pos.getZ(i) + cz;
        var h = G.terrain.height(wx, wz);
        pos.setY(i, h);

        // 顶点色：高处偏亮、低处偏暗，加一点确定性抖动避免死板
        var t = G.M.clamp01((h + 2) / 9);
        var jitter = (Math.sin(wx * 1.7) * Math.cos(wz * 1.3)) * 0.03;
        var v = darkMul + (lightMul - darkMul) * G.M.clamp01(t + jitter);
        colors[i * 3] = v;
        colors[i * 3 + 1] = v;
        colors[i * 3 + 2] = v;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      var mat = G.celMaterial('#FFFFFF', {
        steps: 2,
        darkness: 0.86,
        map: G.art.grassTexture({
          base: opts.color,
          repeat: opts.repeat || 8,
          seed: opts.seed || 5
        }),
        vertexColors: true
      });

      var m = new THREE.Mesh(geo, mat);
      m.position.set(cx, 0, cz);
      m.receiveShadow = true;
      return m;
    }

    // 城镇地面（土黄，平坦）
    var townMesh = buildGroundMesh({
      minX: -20, maxX: 20, minZ: -14, maxZ: 14,
      segX: 20, segZ: 14,
      color: '#C9A87C', repeat: 8, seed: 3
    });
    scene.add(townMesh);
    W.ground.push(townMesh);

    // 野外地面（草地，有起伏）
    // 范围必须比 WORLD 边界大很多：等距正交相机在 45° 下看到的范围
    // 远超逻辑边界（视口高 24、宽约 43，加上俯角投影拉长），
    // 网格小了就会在画面边缘露出天空（踩过）。
    // 这里给到 ±90 / z∈[-50,130]，远超玩家可达范围。
    var fieldMesh = buildGroundMesh({
      minX: -90, maxX: 90, minZ: -12, maxZ: 130,
      segX: 120, segZ: 96,
      color: G.PALETTE.grass, repeat: 26, seed: 9
    });
    scene.add(fieldMesh);
    W.ground.push(fieldMesh);

    // 世界边界（不可见的围栏）——用碰撞体实现，不画几何

    // ---- 静态物件 ----
    W.props = [];
    W.colliders = [];
    W.interactables = [];

    var D = G.DATA.PROPS;
    for (var i = 0; i < D.length; i++) {
      var spec = D[i];
      var obj = W.buildProp(spec);
      if (!obj) continue;
      scene.add(obj);
      W.props.push({ spec: spec, obj: obj });
    }

    // ---- NPC ----
    W.buildNPCs();

    // ---- 批量植被（草丛 + 野花）----
    // 性能要点：绝不能每丛草一个 Mesh（会产生上千 draw call）。
    // 这里用 InstancedMesh：一次 draw call 画几百丛。
    W.buildVegetation();

    // ---- 刷怪区 ----
    W.spawnZones = [];
    for (var s = 0; s < G.DATA.SPAWN_ZONES.length; s++) {
      var z = G.DATA.SPAWN_ZONES[s];
      W.spawnZones.push({
        data: z, timer: 2, alive: []
      });
    }

    return scene;
  };

  /** 按 spec 构建单个场景物件 */
  W.buildProp = function (spec, parentScene) {
    var scene = parentScene || W.scene;
    var obj = null;
    var art = G.art;

    switch (spec.type) {
      case 'torii':
        obj = art.torii({ width: spec.w || 5, height: spec.h || 6 });
        // 鸟居柱子加碰撞
        W.addCircleCollider(spec.x - (spec.w || 5) / 2, spec.z, 0.55);
        W.addCircleCollider(spec.x + (spec.w || 5) / 2, spec.z, 0.55);
        break;

      case 'lantern':
        obj = art.lantern({ poleH: spec.poleH || 2.6 });
        W.addCircleCollider(spec.x, spec.z, 0.32);
        break;

      case 'sakura':
        obj = art.sakura({ scale: spec.scale || 1, seed: spec.seed || 1 });
        W.addCircleCollider(spec.x, spec.z, 0.55 * (spec.scale || 1));
        break;

      case 'house':
        obj = art.house({
          w: spec.w, d: spec.d, h: spec.h,
          noren: spec.noren,
          roof: spec.roof
        });
        // 房屋用矩形碰撞
        W.addBoxCollider(spec.x, spec.z, spec.w, spec.d, spec.rotY || 0);
        break;

      case 'bamboo':
        obj = art.bamboo({ count: spec.count, spread: spec.spread, seed: spec.seed });
        W.addCircleCollider(spec.x, spec.z, 0.8);
        break;

      case 'stairs':
        obj = art.stoneStairs({ steps: spec.steps, w: spec.w, rise: spec.rise, run: spec.run });
        break;

      case 'path':
        obj = art.path({ w: spec.w, d: spec.d, y: spec.y, x: spec.x, z: spec.z, seed: spec.seed });
        break;

      case 'pagoda':
        obj = art.pagoda({
          tiers: spec.tiers, baseW: spec.baseW,
          color: spec.color, roof: spec.roof
        });
        W.addCircleCollider(spec.x, spec.z, (spec.baseW || 5) * 0.72);
        break;

      case 'stoneLantern':
        obj = art.stoneLantern({ scale: spec.scale });
        W.addCircleCollider(spec.x, spec.z, 0.4 * (spec.scale || 1));
        break;

      case 'rock': {
        obj = art.rock({ size: spec.size, seed: spec.seed });
        W.addCircleCollider(spec.x, spec.z, (spec.size || 0.7) * 0.8);
        break;
      }

      case 'bush':
        obj = art.bush({ seed: spec.seed });
        break;

      case 'fence':
        obj = art.fence({ len: spec.len });
        break;

      case 'water':
        obj = art.water({ w: spec.w, d: spec.d, y: spec.y });
        // 水面不挡路，但降低移动速度（由 terrain query 处理）
        break;

      case 'stele': {
        obj = art.stele();
        W.addCircleCollider(spec.x, spec.z, 0.45);
        W.interactables.push({
          uid: spec.uid, kind: 'stele', x: spec.x, z: spec.z,
          radius: 2.2, obj: obj,
          text: G.DATA.STELES && G.DATA.STELES[spec.uid] || '……字迹已经被雨水磨平了。'
        });
        break;
      }

      case 'knot': {
        obj = art.knot({ color: spec.color });
        W.interactables.push({
          uid: spec.uid, kind: 'knot', x: spec.x, z: spec.z,
          radius: 2.6, obj: obj
        });
        break;
      }

      case 'chest': {
        obj = art.chest();
        W.addCircleCollider(spec.x, spec.z, 0.4);
        W.interactables.push({
          uid: spec.uid, kind: 'chest', x: spec.x, z: spec.z,
          radius: 1.9, obj: obj, loot: spec.loot || 'common', opened: false
        });
        break;
      }

      case 'pot': {
        obj = art.pot();
        W.interactables.push({
          uid: spec.uid, kind: 'pot', x: spec.x, z: spec.z,
          radius: 1.5, obj: obj, broken: false, isDestructible: true
        });
        break;
      }

      case 'node': {
        obj = art.resourceNode({ type: spec.nodeType });
        W.interactables.push({
          uid: spec.uid, kind: 'node', nodeType: spec.nodeType,
          x: spec.x, z: spec.z, radius: 1.7, obj: obj,
          remaining: 3, cooldown: 0
        });
        break;
      }

      case 'shrine': {
        obj = art.shrine();
        W.addCircleCollider(spec.x, spec.z, 1.2);
        W.interactables.push({
          uid: 'shrine_town', kind: 'shrine', x: spec.x, z: spec.z,
          radius: 2.4, obj: obj
        });
        break;
      }

      case 'gate': {
        // 副本入口：两扇石门 + 幽光
        var g = new THREE.Group();
        var frameColor = G.PALETTE.stoneDark;
        [-1, 1].forEach(function (s) {
          var pillar = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 5.2, 0.9),
            G.celMaterial(frameColor, { steps: 2 })
          );
          pillar.position.set(s * 3.2, 2.6, 0);
          pillar.castShadow = true;
          g.add(pillar);
        });
        var lintel = new THREE.Mesh(new THREE.BoxGeometry(8, 0.8, 1.0),
          G.celMaterial(frameColor, { steps: 2 }));
        lintel.position.set(0, 5.4, 0);
        lintel.castShadow = true;
        g.add(lintel);
        // 门洞里的幽光面
        var glowMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color('#8FC4D8'), transparent: true, opacity: 0.45,
          side: THREE.DoubleSide, depthWrite: false
        });
        var glowPlane = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 4.8), glowMat);
        glowPlane.position.set(0, 2.5, 0);
        g.add(glowPlane);
        g.userData.glow = glowMat;
        obj = g;
        W.addCircleCollider(spec.x - 3.2, spec.z, 0.6);
        W.addCircleCollider(spec.x + 3.2, spec.z, 0.6);
        W.interactables.push({
          uid: spec.uid || 'gate_dungeon', kind: 'gate', x: spec.x, z: spec.z,
          radius: 3.2, obj: g
        });
        break;
      }
    }

    if (obj) {
      obj.position.x = spec.x;
      obj.position.z = spec.z;
      // 贴地：所有道具都放在地面上。
      // 例外：water / gate 自己管理高度；path 内部已按世界坐标逐顶点算过高度，
      // 再抬一次会 double-offset（悬空）。
      if (spec.type !== 'water' && spec.type !== 'gate' && spec.type !== 'path') {
        obj.position.y = W.groundY(spec.x, spec.z);
      }
      if (spec.rotY) obj.rotation.y = spec.rotY;
      obj.userData.spec = spec;
      obj.userData.baseY = obj.position.y;
      obj.userData.floatPhase = Math.random() * 6.28;

      // 烘焙接地 AO：越贴近地面的部分越暗。
      // 这是"告别纯色块简约感"最有效的一步——没有接触阴影，
      // 物体看起来像贴纸浮在绿布上。
      // falloff 由 bakeContactAO 内部按物体高度自动算（踩过：写死会烧黑细高物体）。
      if (spec.type !== 'water' && spec.type !== 'path' &&
          spec.type !== 'pagoda' && spec.type !== 'knot' && spec.type !== 'gate') {
        W.bakeContactAO(obj, W.groundY(spec.x, spec.z), {
          strength: spec.type === 'house' ? 0.38 : 0.42
        });
      }
    }
    return obj;
  };

  // =====================================================================
  // 批量植被（InstancedMesh，单 draw call）
  // =====================================================================
  W.buildVegetation = function () {
    var rnd = G.mulberry32(90210);
    var W_D = G.DATA.WORLD;

    // 采样区域：只铺野外（城镇保持干净）
    var TOWN = G.DATA.TOWN;
    function inField(x, z) {
      if (x >= TOWN.minX && x <= TOWN.maxX && z >= TOWN.minZ && z <= TOWN.maxZ) return false;
      if (z < 14) return false;
      return true;
    }

    // ---- 草丛 ----
    var tuftCount = 420;
    var tuftGeo = new THREE.PlaneGeometry(0.5, 0.34);
    var tuftMat = G.celMaterial('#9CB87A', {
      steps: 2, darkness: 0.9, side: THREE.DoubleSide,
      transparent: true, alphaTest: 0.4
    });
    var tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, tuftCount * 2);
    tufts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    tufts.receiveShadow = false;
    tufts.castShadow = false;

    var m4 = new THREE.Matrix4();
    var q = new THREE.Quaternion();
    var pos = new THREE.Vector3();
    var scale = new THREE.Vector3();
    var idx = 0;

    for (var i = 0; i < tuftCount; i++) {
      var x = W_D.minX + rnd() * (W_D.maxX - W_D.minX);
      var z = 14 + rnd() * 52;
      if (!inField(x, z)) continue;
      // 不在水里
      if (G.terrain.isUnderwater(x, z)) continue;

      var gy = G.terrain.height(x, z);
      var s = 0.7 + rnd() * 0.7;

      // 每丛两片交叉
      for (var k = 0; k < 2; k++) {
        var ang = rnd() * Math.PI + k * Math.PI / 2;
        q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), ang);
        pos.set(x, gy + 0.16 * s, z);
        scale.set(s, s, s);
        m4.compose(pos, q, scale);
        tufts.setMatrixAt(idx++, m4);
      }
    }
    tufts.count = idx;
    tufts.instanceMatrix.needsUpdate = true;
    W.scene.add(tufts);
    W.vegetation = W.vegetation || {};
    W.vegetation.tufts = tufts;

    // ---- 野花 ----
    var flowerCount = 150;
    var flowerGeo = new THREE.IcosahedronGeometry(0.09, 0);
    var flowerColors = ['#F7C8D8', '#FBF3E4', '#E8C25A', '#D9A0E8'];
    var flowerMat = G.celMaterial('#FFFFFF', { steps: 2, darkness: 0.9, vertexColors: false });
    // 用 InstancedMesh + instanceColor 上色
    var flowers = new THREE.InstancedMesh(flowerGeo, flowerMat, flowerCount);
    flowers.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(flowerCount * 3), 3);

    var fIdx = 0;
    for (var f = 0; f < flowerCount; f++) {
      var fx = W_D.minX + rnd() * (W_D.maxX - W_D.minX);
      var fz = 15 + rnd() * 50;
      if (!inField(fx, fz)) continue;
      if (G.terrain.isUnderwater(fx, fz)) continue;

      var fgy = G.terrain.height(fx, fz);
      var fs = 0.8 + rnd() * 0.6;
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6.28);
      pos.set(fx, fgy + 0.3 * fs, fz);
      scale.set(fs, fs, fs);
      m4.compose(pos, q, scale);
      flowers.setMatrixAt(fIdx, m4);

      var c = new THREE.Color(flowerColors[Math.floor(rnd() * flowerColors.length)]);
      flowers.instanceColor.setXYZ(fIdx, c.r, c.g, c.b);
      fIdx++;
    }
    flowers.count = fIdx;
    flowers.instanceMatrix.needsUpdate = true;
    flowers.instanceColor.needsUpdate = true;
    W.scene.add(flowers);
    W.vegetation.flowers = flowers;
  };

  /**
   * 给一组几何体烘焙"接地 AO"：越靠近地面越暗。
   *
   * 为什么用顶点色而不是 SSAO：
   *   SSAO 需要额外 G-Buffer + 多次采样，在 640x360 上每帧都是明显的开销，
   *   而且 file:// 单文件下没有后处理链可用。顶点色烘焙是零运行时成本，
   *   且这类"物体与地面的接触阴影"本来就是静态的，烘一次就够。
   *
   * 【踩过的坑：AO 把细高物体烧黑】
   * 初版对石灯笼/竹子也用了 falloff=1.3、strength=0.5。这两类物体
   * 整体高度只有 1~2 单位，顶点几乎全部落在 falloff 之内，
   * AO 系数接近 0.5，再叠加 Toon 暗部 -> 渲染成黑灰色块。
   * 正确做法：falloff 必须与物体自身高度成比例，
   * 只让"真正贴地的那一小段"变暗。
   *
   * @param {THREE.Group} group
   * @param {number} groundY 该物件所在地面高度
   * @param {object} opt { strength, falloff, height }
   */
  W.bakeContactAO = function (group, groundY, opt) {
    opt = opt || {};
    var strength = opt.strength != null ? opt.strength : 0.5;

    // 先量出这个 group 的实际高度范围
    var box = new THREE.Box3().setFromObject(group);
    var groupHeight = Math.max(0.5, box.max.y - (groundY || 0));

    // falloff 默认取高度的 22%，最少 0.35：
    // 这样只有底部一小圈被压暗，不会把整个物体烧掉。
    var falloff = opt.falloff != null
      ? opt.falloff
      : Math.max(0.35, groupHeight * 0.22);

    group.traverse(function (node) {
      if (!node.isMesh || !node.geometry) return;
      var geo = node.geometry;
      if (geo.attributes.color) return;   // 已经烘过

      var pos = geo.attributes.position;
      if (!pos) return;

      node.updateMatrixWorld(true);
      var colors = new Float32Array(pos.count * 3);
      var v = new THREE.Vector3();

      for (var i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        v.applyMatrix4(node.matrixWorld);
        var h = v.y - groundY;
        var t = G.M.clamp01(h / falloff);
        // 平滑衰减：只有最底部接近 1-strength
        var ao = 1 - strength * (1 - t) * (1 - t);
        colors[i * 3] = ao;
        colors[i * 3 + 1] = ao;
        colors[i * 3 + 2] = ao;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      if (node.material && !node.material.vertexColors) {
        node.material.vertexColors = true;
        node.material.needsUpdate = true;
      }
    });
  };

  // ---------- 碰撞体（手工简单形状，够用且快） ----------
  W.addCircleCollider = function (x, z, r) {
    W.colliders.push({ kind: 'circle', x: x, z: z, r: r });
  };
  W.addBoxCollider = function (x, z, w, d, rotY) {
    W.colliders.push({ kind: 'box', x: x, z: z, w: w, d: d, rotY: rotY || 0 });
  };

  /**
   * 取某点的地面高度。所有实体的 y 都应该经过这里，
   * 不要直接写字面量（踩过：地形改造后实体半埋进土里）。
   */
  W.groundY = function (x, z) {
    return G.terrain ? G.terrain.height(x, z) : 0;
  };

  /** 水面高度（河） */
  W.waterY = function () {
    return G.terrain ? G.terrain.waterLevel() : -1.15;
  };

  /** 把点推出所有碰撞体；返回修正后的位置 */
  var _tmp = { x: 0, z: 0 };
  W.resolveCollision = function (x, z, radius) {
    radius = radius || 0.34;
    var i, c, dx, dz, dist, minDist;
    for (i = 0; i < W.colliders.length; i++) {
      c = W.colliders[i];
      if (c.kind === 'circle') {
        dx = x - c.x; dz = z - c.z;
        dist = Math.sqrt(dx * dx + dz * dz);
        minDist = c.r + radius;
        if (dist < minDist && dist > 1e-5) {
          var push = (minDist - dist) / dist;
          x += dx * push;
          z += dz * push;
        } else if (dist <= 1e-5) {
          x += minDist; // 完全重合时随便推开
        }
      } else {
        // 旋转盒：转到局部坐标判断
        var cos = Math.cos(-c.rotY), sin = Math.sin(-c.rotY);
        var lx = (x - c.x) * cos - (z - c.z) * sin;
        var lz = (x - c.x) * sin + (z - c.z) * cos;
        var hw = c.w / 2 + radius, hd = c.d / 2 + radius;
        if (Math.abs(lx) < hw && Math.abs(lz) < hd) {
          // 沿最短轴推出
          var ox = hw - Math.abs(lx);
          var oz = hd - Math.abs(lz);
          if (ox < oz) lx = lx >= 0 ? hw : -hw;
          else lz = lz >= 0 ? hd : -hd;
          // 转回世界
          var c2 = Math.cos(c.rotY), s2 = Math.sin(c.rotY);
          x = c.x + lx * c2 - lz * s2;
          z = c.z + lx * s2 + lz * c2;
        }
      }
    }
    // 世界边界
    var B = G.DATA.WORLD;
    if (x < B.minX) x = B.minX;
    if (x > B.maxX) x = B.maxX;
    if (z < B.minZ) z = B.minZ;
    if (z > B.maxZ) z = B.maxZ;
    _tmp.x = x; _tmp.z = z;
    return _tmp;
  };

  /** 判断是否在城镇安全区 */
  W.inTown = function (x, z) {
    var T = G.DATA.TOWN;
    return x >= T.minX && x <= T.maxX && z >= T.minZ && z <= T.maxZ;
  };

  /** 地形速度系数（水里慢、陡坡也慢） */
  W.terrainSpeed = function (x, z) {
    var mul = 1;
    // 水中
    if (G.terrain && G.terrain.isUnderwater(x, z)) mul *= 0.62;
    // 陡坡（超过 0.35 的坡度开始减速）
    if (G.terrain) {
      var st = G.terrain.steepness(x, z);
      if (st > 0.35) mul *= Math.max(0.55, 1 - (st - 0.35) * 0.9);
    }
    return mul;
  };

  // =====================================================================
  // NPC
  // =====================================================================
  W.buildNPCs = function () {
    W.npcs = [];
    for (var i = 0; i < G.DATA.NPCS.length; i++) {
      var def = G.DATA.NPCS[i];
      var look = G.makeLook(def.look);
      var atlas = G.getChibiAtlas(look, def.id);
      var m = G.makeChibiMesh(atlas, { worldH: 2.45 });
      var sp = W.isNight() ? def.night : def.day;
      m.position.set(sp.x, W.groundY(sp.x, sp.z) + 1.225, sp.z);
      W.scene.add(m);
      var npc = {
        def: def, look: look, atlas: atlas, mesh: m,
        x: sp.x, z: sp.z,
        dir: 4, animPhase: 'idle', animFrame: 0, animT: 0,
        tick: Math.random() * 3
      };
      G.sprite.update(m, atlas, 4, 'idle', 0);
      W.npcs.push(npc);
      W.addCircleCollider(sp.x, sp.z, 0.4);
    }
  };

  /** 昼夜切换时把 NPC 挪到对应位置 */
  W.relocateNPCs = function () {
    var night = W.isNight();
    for (var i = 0; i < W.npcs.length; i++) {
      var npc = W.npcs[i];
      var target = night ? npc.def.night : npc.def.day;
      npc.x = target.x; npc.z = target.z;
      npc.mesh.position.x = target.x;
      npc.mesh.position.z = target.z;
      npc.mesh.position.y = W.groundY(target.x, target.z) + 1.225;
    }
  };

  // =====================================================================
  // 昼夜（isNight / nightFactor / duskFactor 定义在文件顶部，build 之前）
  // =====================================================================

  W.updateDayNight = function (dt) {
    var prevNight = W.isNight();
    W.timeOfDay += dt / W.dayLengthSec;
    if (W.timeOfDay >= 1) {
      W.timeOfDay -= 1;
      W.dayCount++;
      G.bus.emit('day:passed', W.dayCount);
    }
    if (W.isNight() !== prevNight) {
      W.relocateNPCs();
      G.bus.emit('phase:changed', W.isNight() ? 'night' : 'day');
    }

    // ---- 光照插值 ----
    var n = W.nightFactor();
    var dusk = W.duskFactor();
    var t = G.M.clamp01(n);

    // 白天：暖白高强度；夜晚：冷蓝低强度
    // 踩过：ambient 0.78 + sun 1.15 + darkness 0.5 的组合让白墙变灰，
    // 提高 material darkness 到 0.72 后仍需把 sun 拉到 1.6
    var sunColor = new THREE.Color('#FFF6E8').lerp(new THREE.Color('#4A5A8C'), t);
    if (dusk > 0) {
      sunColor.lerp(new THREE.Color('#FFB070'), dusk * 0.85 * (1 - t * 0.4));
    }
    var sunIntensity = G.M.lerp(1.62, 0.42, t);
    var ambIntensity = G.M.lerp(0.55, 0.3, t);
    var hemiIntensity = G.M.lerp(0.62, 0.26, t);
    var fillIntensity = G.M.lerp(0.42, 0.25, t);

    W.sun.color.copy(sunColor);
    W.sun.intensity = sunIntensity;
    W.ambient.intensity = ambIntensity;
    if (W.hemi) W.hemi.intensity = hemiIntensity;
    if (W.fill) W.fill.intensity = fillIntensity;

    // 天空
    var skyDay = new THREE.Color(G.PALETTE.sky);
    var skyNight = new THREE.Color(G.PALETTE.nightSky);
    var bgColor = skyDay.clone().lerp(skyNight, t);
    if (dusk > 0) {
      bgColor.lerp(new THREE.Color('#F5B078'), dusk * 0.6);
    }
    W.scene.background.copy(bgColor);

    // 雾
    var fogColor = bgColor.clone().lerp(new THREE.Color('#FFFFFF'), 0.18);
    if (W.scene.fog) {
      W.scene.fog.color.copy(fogColor);
      W.scene.fog.near = G.M.lerp(62, 50, t);
      W.scene.fog.far = G.M.lerp(105, 82, t);
    }

    // 太阳位置
    // timeOfDay 0.25 = 日出（东），0.5 = 正午（顶），0.75 = 日落（西）
    var dayAngle = (W.timeOfDay - 0.25) / 0.5 * Math.PI;  // 白天 0..PI
    var sunH, sunX;
    if (W.timeOfDay >= 0.25 && W.timeOfDay <= 0.75) {
      sunH = Math.sin(dayAngle);
      sunX = -Math.cos(dayAngle);
    } else {
      // 夜间太阳在地平线以下（用月亮方向代替，视觉上保持有方向光）
      sunH = 0.35;
      sunX = 0.5;
    }
    W.sun.position.set(sunX * 34, Math.max(8, sunH * 40), 16 + sunH * 12);
    W.sun.target.position.set(0, 0, 30);
    W.sun.target.updateMatrixWorld();

    // 灯的亮度在夜间更明显
    for (var i = 0; i < W.props.length; i++) {
      var p = W.props[i];
      if (p.obj && p.obj.userData && p.obj.userData.light) {
        p.obj.userData.light.intensity = G.M.lerp(0.2, 2.2, t);
      }
    }
  };

  // =====================================================================
  // 刷怪
  // =====================================================================
  W.updateSpawns = function (dt) {
    if (W.inDungeon) return;
    var night = W.isNight();
    for (var i = 0; i < W.spawnZones.length; i++) {
      var z = W.spawnZones[i];
      var data = z.data;
      // 清理死掉的
      z.alive = z.alive.filter(function (e) { return !e.dead; });

      z.timer -= dt;
      if (z.timer <= 0) {
        var table = night ? data.night : data.day;
        var totalWanted = 0;
        for (var k = 0; k < table.length; k++) totalWanted += table[k].count;

        if (z.alive.length < totalWanted) {
          // 刷一只
          var pick = G.weighted(table.map(function (e) {
            return { weight: e.count, id: e.id };
          }));
          if (pick) {
            var pos = W.findSpawnPoint(data);
            if (pos) {
              var enemy = G.enemy.spawn(pick.id, pos.x, pos.z, z);
              if (enemy) { z.alive.push(enemy); }
            }
          }
          z.timer = 1.2;
        } else {
          z.timer = data.respawnSec;
        }
      }
    }
  };

  W.findSpawnPoint = function (zoneData) {
    var player = G.player && G.player.state;
    for (var attempt = 0; attempt < 12; attempt++) {
      var x = G.randRange(zoneData.minX, zoneData.maxX);
      var z = G.randRange(zoneData.minZ, zoneData.maxZ);
      // 不要刷在玩家脸上
      if (player) {
        var d = M.dist(x, z, player.x, player.z);
        if (d < 8) continue;
      }
      // 不要在碰撞体里
      var resolved = W.resolveCollision(x, z, 0.5);
      if (M.dist(resolved.x, resolved.z, x, z) > 0.2) continue;
      return { x: x, z: z };
    }
    return null;
  };

  // =====================================================================
  // 每帧更新（浮动、旋转）
  // =====================================================================
  W.update = function (dt, elapsed) {
    W.updateDayNight(dt);
    W.updateSpawns(dt);

    // 视觉小动画
    for (var i = 0; i < W.props.length; i++) {
      var p = W.props[i];
      var spec = p.spec;
      if (!p.obj) continue;
      if (spec.type === 'knot' && p.obj.userData.ring) {
        p.obj.userData.ring.rotation.z += dt * 0.8;
        var s = 1 + Math.sin(elapsed * 2 + p.obj.userData.floatPhase) * 0.06;
        if (p.obj.userData.core) {
          p.obj.userData.core.scale.setScalar(s);
          p.obj.userData.core.rotation.y += dt * 1.2;
        }
      }
      if (spec.type === 'chest' && p.obj.userData.lid) {
        // 未开启的宝箱轻微呼吸（提示可交互）
        var inter = W.interactables.find(function (it) { return it.uid === spec.uid; });
        if (inter && !inter.opened) {
          p.obj.position.y = Math.sin(elapsed * 1.6 + p.obj.userData.floatPhase) * 0.02;
        }
      }
      if (spec.type === 'bamboo' && p.obj.userData.stalks) {
        for (var b = 0; b < p.obj.userData.stalks.length; b++) {
          var st = p.obj.userData.stalks[b];
          var sway = Math.sin(elapsed * 0.9 + st.phase) * 0.02;
          st.mesh.rotation.z = st.baseRotZ + sway;
          if (st.baseRotX != null) st.mesh.rotation.x = st.baseRotX + sway * 0.6;
        }
      }
      if (spec.type === 'gate' && p.obj.userData.glow) {
        p.obj.userData.glow.opacity = 0.35 + Math.sin(elapsed * 1.8) * 0.12;
      }
    }
  };

  // ---------- 查询：最近的可交互物 ----------
  W.nearestInteractable = function (x, z, maxDist) {
    maxDist = maxDist || 2.4;
    var best = null, bestD = maxDist;
    for (var i = 0; i < W.interactables.length; i++) {
      var it = W.interactables[i];
      if (it.kind === 'chest' && it.opened) continue;
      if (it.kind === 'pot' && it.broken) continue;
      if (it.kind === 'node' && it.remaining <= 0) continue;
      var d = M.dist(x, z, it.x, it.z);
      if (d < bestD) { bestD = d; best = it; }
    }
    return best;
  };

  /** 附近的可破坏物（攻击时顺带打碎） */
  W.destructiblesNear = function (x, z, radius) {
    var out = [];
    for (var i = 0; i < W.interactables.length; i++) {
      var it = W.interactables[i];
      if (!it.isDestructible || it.broken) continue;
      if (M.dist(x, z, it.x, it.z) < radius) out.push(it);
    }
    return out;
  };

})(window.G = window.G || {});

</script>

<script>
/* 60-inventory.js — 背包、装备、掉落、重铸
 */
(function (G) {
  'use strict';

  var M = G.M;
  var I = G.inv = {};

  // 简单的整数 UID
  var uidSeq = 1;

  // =====================================================================
  // 装备生成
  // =====================================================================
  /**
   * 随机生成一件装备。
   * @param {string} slot weapon|charm|robe
   * @param {number} qualityFloor 最低品质 1..5
   */
  I.rollGear = function (slot, qualityFloor) {
    var rnd = Math.random;
    var tmpl = G.DATA.GEAR_TEMPLATES[slot];
    if (!tmpl) return null;

    // 品质：越低越常见，但受 floor 限制
    var q = 1;
    var roll = rnd();
    if (roll > 0.97) q = 5;
    else if (roll > 0.88) q = 4;
    else if (roll > 0.68) q = 3;
    else if (roll > 0.30) q = 2;
    else q = 1;
    q = Math.max(q, qualityFloor || 1);

    var mult = G.DATA.QUALITY_MULT[q - 1];
    var baseAtk = Math.round(M.lerp(tmpl.baseAtk[0], tmpl.baseAtk[1], rnd()) * mult);
    var baseDef = Math.round(M.lerp(tmpl.baseDef[0], tmpl.baseDef[1], rnd()) * mult);

    var affixCount = G.DATA.QUALITY_AFFIXES[q - 1];
    var affixes = [];
    var usedStats = {};
    for (var i = 0; i < affixCount; i++) {
      var pool = G.DATA.AFFIXES.filter(function (a) {
        return a.qualityMin <= q && !usedStats[a.stat];
      });
      if (!pool.length) break;
      var pick = G.weighted(pool.map(function (a) { return { weight: a.weight, a: a }; }));
      if (!pick) break;
      var af = pick.a;
      usedStats[af.stat] = true;
      var v = M.lerp(af.min, af.max, Math.pow(rnd(), 0.7)) * (1 + (q - 1) * 0.12);
      if (af.stat === 'crit' || af.stat === 'speed' || af.stat === 'lifesteal') {
        v = Math.round(v * 1000) / 1000;
      } else {
        v = Math.round(v);
      }
      affixes.push({ id: af.id, stat: af.stat, name: af.name, value: v, fmt: af.fmt });
    }

    var name = tmpl.names[Math.floor(rnd() * tmpl.names.length)] +
      G.DATA.GEAR_SUFFIX[Math.floor(rnd() * G.DATA.GEAR_SUFFIX.length)];

    return {
      uid: 'g' + (uidSeq++),
      id: 'gear_roll',
      name: name,
      kind: 'gear',
      slot: slot,
      quality: q,
      baseAtk: baseAtk,
      baseDef: baseDef,
      affixes: affixes,
      value: Math.round((20 + q * 30) * (1 + affixes.length * 0.3)),
      icon: { shape: 'gear', color: G.DATA.QUALITY_COLORS[q - 1] }
    };
  };

  /** 把物品定义实例化（固定物品加 uid） */
  I.instantiate = function (defId, opts) {
    opts = opts || {};
    if (defId === 'gear_roll') {
      var slots = ['weapon', 'charm', 'robe'];
      var slot = opts.slot || slots[Math.floor(Math.random() * slots.length)];
      return I.rollGear(slot, opts.qualityFloor || 1);
    }
    var def = G.DATA.ITEMS[defId];
    if (!def) return null;
    var item = {};
    for (var k in def) item[k] = def[k];
    item.uid = 'i' + (uidSeq++);
    if (item.kind === 'gear') {
      item.affixes = [];
      if (item.affixSlots > 0) {
        // 固定装备也补词缀
        var pool = G.DATA.AFFIXES.filter(function (a) { return a.qualityMin <= item.quality; });
        for (var a = 0; a < item.affixSlots; a++) {
          var p = pool[Math.floor(Math.random() * pool.length)];
          if (!p) break;
          var v = M.lerp(p.min, p.max, Math.random()) * (1 + (item.quality - 1) * 0.12);
          v = (p.stat === 'crit' || p.stat === 'speed' || p.stat === 'lifesteal')
            ? Math.round(v * 1000) / 1000 : Math.round(v);
          item.affixes.push({ id: p.id, stat: p.stat, name: p.name, value: v, fmt: p.fmt });
        }
      }
    }
    if (opts.qty) item.qty = opts.qty;
    return item;
  };

  // =====================================================================
  // 背包操作
  // =====================================================================
  I.add = function (item, qty) {
    if (!item) return false;
    var st = G.player.state;
    var stackable = (item.kind === 'consumable' || item.kind === 'material');

    if (stackable) {
      for (var i = 0; i < st.bag.length; i++) {
        var b = st.bag[i];
        if (b.id === item.id && b.kind === item.kind) {
          var limit = item.stack || 99;
          var add = qty || 1;
          if (b.qty + add <= limit) {
            b.qty += add;
            return true;
          }
        }
      }
    }

    var clone = {};
    for (var k in item) clone[k] = item[k];
    clone.qty = qty || 1;
    if (st.bag.length >= 40) {
      G.ui.toast('背包满了');
      return false;
    }
    st.bag.push(clone);
    return true;
  };

  I.remove = function (uid, qty) {
    var st = G.player.state;
    for (var i = 0; i < st.bag.length; i++) {
      if (st.bag[i].uid === uid) {
        var n = qty || 1;
        st.bag[i].qty -= n;
        if (st.bag[i].qty <= 0) st.bag.splice(i, 1);
        return true;
      }
    }
    return false;
  };

  /** 装备/卸下 */
  I.equip = function (uid) {
    var st = G.player.state;
    var idx = -1;
    for (var i = 0; i < st.bag.length; i++) {
      if (st.bag[i].uid === uid) { idx = i; break; }
    }
    if (idx < 0) return false;
    var item = st.bag[idx];
    if (item.kind !== 'gear') return false;

    var slot = item.slot;
    var old = st.equip[slot];

    st.bag.splice(idx, 1);
    st.equip[slot] = item;

    if (old) st.bag.push(old);

    G.player.recalcStats();
    G.bus.emit('ui:dirty');
    G.bus.emit('sfx', 'equip');
    return true;
  };

  I.unequip = function (slot) {
    var st = G.player.state;
    var item = st.equip[slot];
    if (!item) return false;
    if (st.bag.length >= 40) { G.ui.toast('背包满了'); return false; }
    st.equip[slot] = null;
    st.bag.push(item);
    G.player.recalcStats();
    G.bus.emit('ui:dirty');
    return true;
  };

  I.useConsumable = function (uid) {
    var st = G.player.state;
    for (var i = 0; i < st.bag.length; i++) {
      if (st.bag[i].uid === uid) {
        var item = st.bag[i];
        if (item.kind !== 'consumable') return false;
        if (item.heal) {
          st.hp = Math.min(st.maxHp, st.hp + item.heal);
          G.fx.pickupBurst(st.x, st.z, '#7FB069');
          G.ui.toast('使用了 ' + item.name, 1200);
        }
        I.remove(uid, 1);
        G.bus.emit('ui:dirty');
        G.bus.emit('sfx', 'heal');
        return true;
      }
    }
    return false;
  };

  // =====================================================================
  // 重铸（赌博式）
  // =====================================================================
  I.reforgeCost = function (item) {
    if (!item || item.kind !== 'gear') return 0;
    return G.DATA.REFORGE_COST[item.quality - 1];
  };

  I.reforge = function (uid) {
    var st = G.player.state;
    var item = null, fromBag = false, bagIdx = -1;
    for (var s in st.equip) {
      if (st.equip[s] && st.equip[s].uid === uid) { item = st.equip[s]; fromBag = false; break; }
    }
    if (!item) {
      for (var i = 0; i < st.bag.length; i++) {
        if (st.bag[i].uid === uid) { item = st.bag[i]; fromBag = true; bagIdx = i; break; }
      }
    }
    if (!item || item.kind !== 'gear') return { ok: false, msg: '这不是装备' };

    var cost = I.reforgeCost(item);
    if (st.gold < cost) return { ok: false, msg: '金币不足（需要 ' + cost + '）' };

    st.gold -= cost;
    // 重掷全部词条
    var q = item.quality;
    var count = G.DATA.QUALITY_AFFIXES[q - 1];
    var affixes = [];
    var used = {};
    for (var k = 0; k < count; k++) {
      var pool = G.DATA.AFFIXES.filter(function (a) { return a.qualityMin <= q && !used[a.stat]; });
      if (!pool.length) break;
      var p = G.weighted(pool.map(function (a) { return { weight: a.weight, a: a }; }));
      if (!p) break;
      var af = p.a;
      used[af.stat] = true;
      var v = M.lerp(af.min, af.max, Math.pow(Math.random(), 0.7)) * (1 + (q - 1) * 0.12);
      v = (af.stat === 'crit' || af.stat === 'speed' || af.stat === 'lifesteal')
        ? Math.round(v * 1000) / 1000 : Math.round(v);
      affixes.push({ id: af.id, stat: af.stat, name: af.name, value: v, fmt: af.fmt });
    }
    item.affixes = affixes;
    G.player.recalcStats();
    G.bus.emit('ui:dirty');
    G.bus.emit('sfx', 'reforge');
    return { ok: true, item: item, cost: cost };
  };

  // =====================================================================
  // 掉落
  // =====================================================================
  var L = G.loot = { drops: [] };

  L.spawnFromTable = function (tableId, x, z, monsterDef) {
    var table = G.DATA.LOOT[tableId];
    if (!table) return;

    // 金币
    if (monsterDef) {
      var gold = Math.floor(M.lerp(monsterDef.goldMin, monsterDef.goldMax, Math.random()));
      if (gold > 0) L.spawnDrop('gold', x + (Math.random() - 0.5) * 1.2, z + (Math.random() - 0.5) * 1.2, { amount: gold });
    }

    // 保底
    if (table.guaranteed) {
      for (var g = 0; g < table.guaranteed.length; g++) {
        var it = I.instantiate(table.guaranteed[g]);
        if (it) L.spawnDrop('item', x + (Math.random() - 0.5) * 1.4, z + (Math.random() - 0.5) * 1.4, { item: it });
      }
    }

    // 条目
    var entries = table.entries || [];
    var pick = G.weighted(entries.map(function (en) {
      return { weight: en.weight, en: en };
    }));
    if (!pick) return;
    var ent = pick.en;
    var qty = 1;
    if (ent.qty) qty = ent.qty[0] + Math.floor(Math.random() * (ent.qty[1] - ent.qty[0] + 1));
    var item = I.instantiate(ent.itemId, { qualityFloor: ent.qualityFloor });
    if (!item) return;
    L.spawnDrop('item', x + (Math.random() - 0.5) * 1.4, z + (Math.random() - 0.5) * 1.4, { item: item, qty: qty });
  };

  L.spawnDrop = function (kind, x, z, data) {
    var group = new THREE.Group();
    var color = '#E8C25A';

    if (kind === 'gold') {
      var coinMat = G.celMaterial('#E8C25A', { steps: 2, darkness: 0.6, emissive: '#E8C25A', emissiveIntensity: 0.4 });
      for (var i = 0; i < 3; i++) {
        var coin = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.04, 8), coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set((Math.random() - 0.5) * 0.3, 0.12 + i * 0.06, (Math.random() - 0.5) * 0.3);
        group.add(coin);
      }
    } else {
      var q = data.item.quality || 2;
      color = G.DATA.QUALITY_COLORS[q - 1];
      var gemMat = G.celMaterial(color, { steps: 2, darkness: 0.5, emissive: color, emissiveIntensity: 0.55 });
      var gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), gemMat);
      gem.position.y = 0.3;
      group.add(gem);
      var glow = new THREE.Mesh(
        new THREE.RingGeometry(0.22, 0.3, 12),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(color), transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false })
      );
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = 0.04;
      group.add(glow);
    }

    group.position.set(x, 0, z);
    G.world.scene.add(group);

    var drop = {
      kind: kind, x: x, z: z, group: group,
      data: data, life: 90,           // 90 秒后消失
      phase: Math.random() * 6.28,
      picked: false
    };
    L.drops.push(drop);
  };

  L.update = function (dt, st) {
    for (var i = L.drops.length - 1; i >= 0; i--) {
      var d = L.drops[i];
      d.life -= dt;
      // 浮动
      d.group.position.y = Math.sin(performance.now() * 0.002 + d.phase) * 0.06;
      // 靠近自动拾取
      var dist = M.dist(d.x, d.z, st.x, st.z);
      if (dist < 1.5 && !st.dead) {
        L.pickup(d, i);
        continue;
      }
      if (d.life <= 0) {
        if (d.group.parent) d.group.parent.remove(d.group);
        L.drops.splice(i, 1);
      }
    }
  };

  L.pickup = function (d, idx) {
    var st = G.player.state;
    if (d.kind === 'gold') {
      st.gold += d.data.amount;
      G.ui.toast('+' + d.data.amount + ' 文', 900);
      G.fx.pickupBurst(d.x, d.z, '#E8C25A');
    } else {
      var item = d.data.item;
      var qty = d.data.qty || 1;
      var ok = I.add(item, qty);
      if (ok) {
        var qn = G.DATA.QUALITY_NAMES[item.quality - 1] || '';
        var label = item.kind === 'gear' ? ('[' + qn + '] ' + item.name) : (item.name + (qty > 1 ? ' ×' + qty : ''));
        G.ui.toast('获得 ' + label, 1600);
        G.fx.pickupBurst(d.x, d.z, G.DATA.QUALITY_COLORS[(item.quality || 2) - 1]);
        G.bus.emit('sfx', item.kind === 'gear' && item.quality >= 4 ? 'pickup_rare' : 'pickup');
      }
    }
    if (d.group.parent) d.group.parent.remove(d.group);
    L.drops.splice(idx, 1);
    G.bus.emit('ui:dirty');
  };

  /** 玩家死亡：地上未拾取的掉落消失 */
  L.dropAll = function () {
    for (var i = 0; i < L.drops.length; i++) {
      var d = L.drops[i];
      if (d.group.parent) d.group.parent.remove(d.group);
    }
    if (L.drops.length > 0) {
      G.ui.toast('地上未拾取的物品散失了…', 2400);
    }
    L.drops.length = 0;
  };

  L.clear = function () {
    for (var i = 0; i < L.drops.length; i++) {
      if (L.drops[i].group.parent) L.drops[i].group.parent.remove(L.drops[i].group);
    }
    L.drops.length = 0;
  };

})(window.G = window.G || {});

</script>

<script>
/* 61-quest.js — 任务运行时
 */
(function (G) {
  'use strict';

  var Q = G.quest = {};

  Q.state = {
    active: {},     // id -> { steps: [done,bool...] }
    done: {}        // id -> true
  };

  Q.init = function () {
    Q.state = { active: {}, done: {} };
  };

  Q.start = function (id) {
    var def = G.DATA.QUESTS[id];
    if (!def || Q.state.active[id] || Q.state.done[id]) return false;
    Q.state.active[id] = {
      id: id,
      steps: def.steps.map(function () { return false; }),
      collectProgress: {}
    };
    G.ui.toast('接受任务：' + def.title, 2200);
    G.bus.emit('quest:started', id);
    return true;
  };

  Q.current = function () {
    for (var id in Q.state.active) return G.DATA.QUESTS[id];
    return null;
  };

  Q.getState = function (id) { return Q.state.active[id]; };

  /** 提交进度 */
  Q.progress = function (id, stepIndex) {
    var st = Q.state.active[id];
    if (!st) return;
    if (st.steps[stepIndex]) return;
    st.steps[stepIndex] = true;
    var def = G.DATA.QUESTS[id];
    G.ui.toast('· ' + def.steps[stepIndex].text, 1600);
    if (Q.isComplete(id)) Q.complete(id);
  };

  Q.isComplete = function (id) {
    var st = Q.state.active[id];
    if (!st) return false;
    for (var i = 0; i < st.steps.length; i++) if (!st.steps[i]) return false;
    return true;
  };

  Q.complete = function (id) {
    var def = G.DATA.QUESTS[id];
    var st = Q.state.active[id];
    if (!st) return;
    delete Q.state.active[id];
    Q.state.done[id] = true;

    G.ui.toast('任务完成：' + def.title, 2600);
    var r = def.rewards || {};
    if (r.exp) G.player.gainExp(r.exp);
    if (r.gold) G.player.state.gold += r.gold;
    if (r.unlockSkill) {
      G.player.state.skillUnlocked[r.unlockSkill] = true;
      var sk = G.DATA.SKILLS[r.unlockSkill];
      G.ui.toast('习得技能：' + (sk ? sk.name : ''), 3000);
      G.bus.emit('sfx', 'skill_unlock');
    }
    G.bus.emit('quest:done', id);
    G.save.save();

    if (def.nextId) Q.start(def.nextId);
  };

  // ---------- 事件钩子 ----------
  Q.onKill = function (defId) {
    for (var id in Q.state.active) {
      var def = G.DATA.QUESTS[id];
      var st = Q.state.active[id];
      for (var i = 0; i < def.steps.length; i++) {
        var step = def.steps[i];
        if (st.steps[i]) continue;
        if (step.type === 'kill' && step.target === defId) {
          st.collectProgress['k' + i] = (st.collectProgress['k' + i] || 0) + 1;
          if (st.collectProgress['k' + i] >= (step.count || 1)) Q.progress(id, i);
        }
      }
    }
  };

  Q.onKnot = function (uid) {
    for (var id in Q.state.active) {
      var def = G.DATA.QUESTS[id];
      var st = Q.state.active[id];
      for (var i = 0; i < def.steps.length; i++) {
        var step = def.steps[i];
        if (st.steps[i]) continue;
        if (step.type === 'knot' && step.target === uid) Q.progress(id, i);
      }
    }
    // 三处结都系上后，触发对白
    var d = G.DATA.DIALOGUES['d_' + uid];
    if (d) {
      G.dlg.start(null, d);
    }
  };

  Q.onTalk = function (npcId) {
    for (var id in Q.state.active) {
      var def = G.DATA.QUESTS[id];
      var st = Q.state.active[id];
      for (var i = 0; i < def.steps.length; i++) {
        var step = def.steps[i];
        if (st.steps[i]) continue;
        if (step.type === 'talk' && step.target === npcId) Q.progress(id, i);
      }
    }
  };

  Q.onCollect = function (itemId, count) {
    for (var id in Q.state.active) {
      var def = G.DATA.QUESTS[id];
      var st = Q.state.active[id];
      for (var i = 0; i < def.steps.length; i++) {
        var step = def.steps[i];
        if (st.steps[i]) continue;
        if (step.type === 'collect' && step.target === itemId) {
          st.collectProgress['c' + i] = count;
          if (count >= (step.count || 1)) Q.progress(id, i);
        }
      }
    }
  };

  Q.onReach = function (pointId) {
    for (var id in Q.state.active) {
      var def = G.DATA.QUESTS[id];
      var st = Q.state.active[id];
      for (var i = 0; i < def.steps.length; i++) {
        var step = def.steps[i];
        if (st.steps[i]) continue;
        if (step.type === 'reach' && step.target === pointId) Q.progress(id, i);
      }
    }
  };

})(window.G = window.G || {});

</script>

<script>
/* 70-ui.js — DOM 覆盖层 UI
 *
 * 所有文字 UI 用 DOM 叠在 canvas 上（不参与像素化），字永远清楚。
 */
(function (G) {
  'use strict';

  var U = G.ui = {};

  U.root = null;
  U.damageLayer = null;
  U.toastLayer = null;
  U.hpFill = null;
  U.expFill = null;
  U.levelText = null;
  U.goldText = null;
  U.clockText = null;
  U.skillEls = [];
  U.toastTimer = 0;
  U.panels = {};

  // =====================================================================
  // 构建
  // =====================================================================
  U.init = function () {
    var root = document.getElementById('ui');
    U.root = root;

    // ---- 左上：状态 ----
    var status = G.dom.el('div', 'panel status', root);

    // 等级 + 名字
    var head = G.dom.el('div', 'status-head', status);
    U.levelText = G.dom.el('span', 'lv', head, 'Lv.1');
    G.dom.el('span', 'name', head, '旅人');

    // HP 条
    var hpWrap = G.dom.el('div', 'bar hp', status);
    var hpBg = G.dom.el('div', 'bar-bg', hpWrap);
    U.hpFill = G.dom.el('div', 'bar-fill', hpWrap);
    U.hpText = G.dom.el('div', 'bar-text', hpWrap, '100 / 100');

    // EXP 条
    var expWrap = G.dom.el('div', 'bar exp', status);
    G.dom.el('div', 'bar-bg', expWrap);
    U.expFill = G.dom.el('div', 'bar-fill', expWrap);

    // 金币 + 时间
    var meta = G.dom.el('div', 'status-meta', status);
    U.goldText = G.dom.el('span', 'gold', meta, '0 文');
    U.clockText = G.dom.el('span', 'clock', meta, '06:00');

    // ---- 左下：技能栏 ----
    var bar = G.dom.el('div', 'skillbar', root);
    U.skillBar = bar;
    for (var i = 1; i <= 4; i++) {
      var sk = G.dom.el('div', 'skill', bar);
      sk.dataset.skill = String(i);
      var key = G.dom.el('div', 'skill-key', sk, String(i));
      var nm = G.dom.el('div', 'skill-name', sk, '—');
      var cd = G.dom.el('div', 'skill-cd', sk, '');
      var icon = G.dom.el('div', 'skill-icon', sk, '');
      sk._name = nm; sk._cd = cd; sk._icon = icon;
      U.skillEls.push(sk);
    }
    // 闪避
    var dodgeEl = G.dom.el('div', 'skill dodge', bar);
    G.dom.el('div', 'skill-key', dodgeEl, 'Shift');
    G.dom.el('div', 'skill-name', dodgeEl, '滾');
    dodgeEl._cd = G.dom.el('div', 'skill-cd', dodgeEl, '');
    U.dodgeEl = dodgeEl;

    // ---- 中下：交互提示 ----
    U.prompt = G.dom.el('div', 'prompt', root);
    U.prompt.style.display = 'none';

    // ---- 中上：Boss 血条 ----
    U.bossBar = G.dom.el('div', 'bossbar', root);
    U.bossBar.style.display = 'none';
    U.bossName = G.dom.el('div', 'boss-name', U.bossBar, '');
    var bossBarBg = G.dom.el('div', 'bar-bg', U.bossBar);
    U.bossFill = G.dom.el('div', 'bar-fill', bossBarBg);

    // ---- 右侧：toast ----
    U.toastLayer = G.dom.el('div', 'toasts', root);

    // ---- 伤害数字层（最高层，不拦截点击） ----
    U.damageLayer = G.dom.el('div', 'dmglayer', root);

    // ---- 受伤红闪 ----
    U.hurtVignette = G.dom.el('div', 'hurtvignette', root);

    // ---- 对话框 ----
    U.buildDialog();

    // ---- 面板（背包 / 商店） ----
    U.buildInventoryPanel();
    U.buildShopPanel();

    // ---- 标题 ----
    U.fadeIn = G.dom.el('div', 'fadein', root);

    U.bindEvents();
  };

  // =====================================================================
  // 面板：背包
  // =====================================================================
  U.buildInventoryPanel = function () {
    var p = G.dom.el('div', 'overlay panel-inv', U.root);
    p.style.display = 'none';
    var head = G.dom.el('div', 'ov-head', p);
    G.dom.el('h2', '', head, '行囊');
    G.dom.el('div', 'hint', head, 'I / Esc 关闭');

    var body = G.dom.el('div', 'ov-body', p);
    var equipCol = G.dom.el('div', 'inv-col equip', body);
    G.dom.el('h3', '', equipCol, '装备');
    U.equipSlots = {};
    ['weapon', 'charm', 'robe'].forEach(function (s) {
      var row = G.dom.el('div', 'equip-slot', equipCol);
      row.dataset.slot = s;
      var label = { weapon: '刀', charm: '护符', robe: '衣装' }[s];
      G.dom.el('div', 'es-label', row, label);
      var box = G.dom.el('div', 'es-box', row, '空');
      U.equipSlots[s] = box;
    });

    var statsCol = G.dom.el('div', 'inv-col stats', body);
    G.dom.el('h3', '', statsCol, '属性');
    U.statList = G.dom.el('div', 'statlist', statsCol);

    var bagCol = G.dom.el('div', 'inv-col bag', body);
    G.dom.el('h3', '', bagCol, '物品');
    U.bagList = G.dom.el('div', 'baglist', bagCol);

    U.panels.inventory = p;
  };

  // =====================================================================
  // 面板：商店
  // =====================================================================
  U.buildShopPanel = function () {
    var p = G.dom.el('div', 'overlay panel-shop', U.root);
    p.style.display = 'none';
    var head = G.dom.el('div', 'ov-head', p);
    U.shopTitle = G.dom.el('h2', '', head, '店铺');
    G.dom.el('div', 'hint', head, 'Esc 关闭');

    U.shopGreet = G.dom.el('div', 'shop-greet', p, '');
    var body = G.dom.el('div', 'ov-body', p);
    U.shopList = G.dom.el('div', 'shoplist', body);
    U.panels.shop = p;
  };

  // =====================================================================
  // 对话框
  // =====================================================================
  U.buildDialog = function () {
    var d = G.dom.el('div', 'dialog', U.root);
    d.style.display = 'none';
    U.dialogEl = d;
    U.dialogName = G.dom.el('div', 'dlg-name', d, '');
    U.dialogText = G.dom.el('div', 'dlg-text', d, '');
    U.dialogChoices = G.dom.el('div', 'dlg-choices', d);
    U.dialogHint = G.dom.el('div', 'dlg-hint', d, '▼ 空格 / 点击 继续');
  };

  // =====================================================================
  // 事件绑定
  // =====================================================================
  U.bindEvents = function () {
    G.bus.on('ui:dirty', function () { U.refreshHUD(); });
    G.bus.on('sfx', function (id) { if (G.audio) G.audio.play(id); });
    G.bus.on('player:levelup', function () { U.refreshHUD(); });
    G.bus.on('phase:changed', function () {
      U.refreshHUD();
      if (G.world.isNight()) U.toast('入夜了', 1400);
      else U.toast('天亮了', 1400);
    });
    G.bus.on('day:passed', function () { U.refreshHUD(); });
  };

  // =====================================================================
  // 每帧刷新
  // =====================================================================
  U.update = function (dt) {
    var st = G.player.state;
    if (!st) return;

    // HP / EXP
    var pct = Math.max(0, st.hp / st.maxHp);
    U.hpFill.style.width = (pct * 100).toFixed(1) + '%';
    U.hpFill.style.background = pct > 0.5 ? 'linear-gradient(180deg,#7FB069,#5C8A4A)'
      : (pct > 0.25 ? 'linear-gradient(180deg,#E8C25A,#B89840)'
                    : 'linear-gradient(180deg,#E05A4F,#A8302A)');
    U.hpText.textContent = Math.ceil(st.hp) + ' / ' + Math.ceil(st.maxHp);

    var epct = Math.min(1, st.exp / Math.max(1, st.expNext));
    U.expFill.style.width = (epct * 100).toFixed(1) + '%';

    U.levelText.textContent = 'Lv.' + st.level;
    U.goldText.textContent = st.gold + ' 文';

    // 时钟
    if (G.world) {
      U.clockText.textContent = G.fmt.clock(G.world.timeOfDay) +
        (G.world.isNight() ? ' 🌙' : ' ☀');
    }

    // 技能冷却
    for (var i = 0; i < 4; i++) {
      var el = U.skillEls[i];
      var n = i + 1;
      var def = G.DATA.SKILLS[n];
      var unlocked = st.skillUnlocked[n];
      el.classList.toggle('locked', !unlocked);
      el._name.textContent = unlocked ? def.name : '未习得';
      var cdState = st.skills[n];
      if (cdState && cdState.cd > 0) {
        el._cd.textContent = cdState.cd.toFixed(1);
        el.classList.add('cooling');
        el._cd.style.height = Math.min(100, (cdState.cd / def.cooldown) * 100) + '%';
      } else {
        el._cd.textContent = '';
        el.classList.remove('cooling');
        el._cd.style.height = '0%';
      }
    }
    // 闪避冷却
    var dodgeReady = st.dodge.cd <= 0;
    U.dodgeEl.classList.toggle('cooling', !dodgeReady);
    U.dodgeEl._cd.textContent = dodgeReady ? '' : st.dodge.cd.toFixed(1);

    // 交互提示
    var near = G.world.nearestInteractable(st.x, st.z, 2.4);
    if (near && !U.panels.inventory.style.display.match(/block/) && U.dialogEl.style.display === 'none') {
      U.prompt.style.display = '';
      U.prompt.textContent = U.interactLabel(near);
    } else {
      U.prompt.style.display = 'none';
    }

    // Boss 血条
    var boss = null;
    for (var b = 0; b < G.enemy.list.length; b++) {
      var en = G.enemy.list[b];
      if (en.def.tier === 'boss' && !en.dead) { boss = en; break; }
    }
    if (boss) {
      U.bossBar.style.display = '';
      U.bossName.textContent = boss.def.name;
      U.bossFill.style.width = (boss.hp / boss.maxHp * 100) + '%';
    } else {
      U.bossBar.style.display = 'none';
    }

    // toast 淡出
    if (U.toastLayer.children.length > 4) {
      U.toastLayer.removeChild(U.toastLayer.firstChild);
    }
  };

  U.interactLabel = function (it) {
    switch (it.kind) {
      case 'stele': return 'E　读碑文';
      case 'chest': return 'E　打开宝箱';
      case 'knot': return 'E　触碰结';
      case 'node': return it.nodeType === 'ore' ? 'E　采掘' : 'E　采集';
      case 'shrine': return 'E　参拜（保存）';
      case 'gate': return 'E　进入忘れ緒の社';
      case 'npc': return 'E　交谈';
      default: return 'E　交互';
    }
  };

  U.refreshHUD = function () {
    // 触发一次重绘（低开销）
    if (G.player.state) U.update(0.016);
  };

  // =====================================================================
  // 提示
  // =====================================================================
  // 踩过的坑：连按 E 读碑文会连续弹 4 条完全相同的 toast，糊满右侧。
  // 这里做去重 + 同一内容 1.2 秒内只允许一条。
  U._lastToast = { msg: '', at: 0 };

  U.toast = function (msg, ms) {
    if (!U.toastLayer) {
      U.toastLayer = G.dom.el('div', 'toasts', U.root);
    }
    var now = performance.now();
    if (msg === U._lastToast.msg && now - U._lastToast.at < 1200) {
      return null;   // 重复内容，丢弃
    }
    U._lastToast.msg = msg;
    U._lastToast.at = now;

    var t = G.dom.el('div', 'toast', U.toastLayer, msg);
    setTimeout(function () {
      t.classList.add('out');
      setTimeout(function () {
        if (t.parentNode) t.parentNode.removeChild(t);
      }, 400);
    }, ms || 1500);
    return t;
  };

  U.flashHurt = function () {
    if (!U.hurtVignette) return;
    U.hurtVignette.classList.remove('on');
    // 强制重排以重启动画
    void U.hurtVignette.offsetWidth;
    U.hurtVignette.classList.add('on');
  };

  U.bossPhase = function (e, phase) {
    U.toast(e.def.name + ' 进入了第 ' + (phase + 1) + ' 阶段', 2200);
  };

  U.bossTelegraph = function (e, sec) {
    U.toast('⚠ 結びの神 蓄力中——快躲开！', 1400);
  };

  // =====================================================================
  // 对话
  // =====================================================================
  U.showDialog = function (npc, dialogueId) {
    U.dialogEl.style.display = '';
    U.dialogName.textContent = npc.def.name;
    var dlg = G.DATA.DIALOGUES[dialogueId];
    if (!dlg) {
      U.dialogText.textContent = '……';
      U.dialogChoices.innerHTML = '';
      return;
    }
    G.dlg.start(npc, dlg);
  };

  U.hideDialog = function () {
    U.dialogEl.style.display = 'none';
    U.dialogChoices.innerHTML = '';
  };

  // =====================================================================
  // 面板开关
  // =====================================================================
  U.togglePanel = function (key) {
    var keys = ['inventory', 'shop'];
    for (var i = 0; i < keys.length; i++) {
      var p = U.panels[keys[i]];
      if (!p) continue;
      if (keys[i] === key) {
        var on = p.style.display === 'none' || !p.style.display;
        p.style.display = on ? '' : 'none';
        if (on) U.renderPanel(key);
      } else {
        p.style.display = 'none';
      }
    }
  };

  U.closeAllPanels = function () {
    var keys = ['inventory', 'shop'];
    for (var i = 0; i < keys.length; i++) {
      if (U.panels[keys[i]]) U.panels[keys[i]].style.display = 'none';
    }
    U.hideDialog();
  };

  U.anyPanelOpen = function () {
    var keys = ['inventory', 'shop'];
    for (var i = 0; i < keys.length; i++) {
      var p = U.panels[keys[i]];
      if (p && p.style.display !== 'none') return true;
    }
    return U.dialogEl.style.display !== 'none';
  };

  U.renderPanel = function (key) {
    if (key === 'inventory') U.renderInventory();
    if (key === 'shop') U.renderShop();
  };

  // =====================================================================
  // 背包渲染
  // =====================================================================
  U.renderInventory = function () {
    var st = G.player.state;

    // 装备位
    ['weapon', 'charm', 'robe'].forEach(function (s) {
      var box = U.equipSlots[s];
      var item = st.equip[s];
      if (!item) {
        box.textContent = '空';
        box.className = 'es-box';
      } else {
        box.textContent = item.name;
        box.className = 'es-box q' + item.quality;
        box.title = U.itemTooltip(item);
      }
    });

    // 属性
    var sl = U.statList;
    sl.innerHTML = '';
    [
      ['攻击', st.atk],
      ['防御', st.def],
      ['生命', Math.ceil(st.hp) + ' / ' + Math.ceil(st.maxHp)],
      ['暴击', (st.crit * 100).toFixed(1) + '%'],
      ['金币', st.gold]
    ].forEach(function (row) {
      var r = G.dom.el('div', 'statrow', sl);
      G.dom.el('span', 'k', r, row[0]);
      G.dom.el('span', 'v', r, String(row[1]));
    });

    // 背包
    var bl = U.bagList;
    bl.innerHTML = '';
    if (st.bag.length === 0) {
      G.dom.el('div', 'empty', bl, '空');
      return;
    }
    st.bag.forEach(function (item) {
      var row = G.dom.el('div', 'bagitem q' + (item.quality || 1), bl);
      var name = G.dom.el('span', 'bi-name', row,
        item.name + (item.qty > 1 ? ' ×' + item.qty : ''));
      if (item.kind === 'gear') {
        G.dom.el('span', 'bi-tag', row, '装备');
        row.addEventListener('click', function () {
          if (G.inv.equip(item.uid)) {
            U.renderInventory();
            U.toast('装备了 ' + item.name, 1200);
          }
        });
      } else if (item.kind === 'consumable') {
        G.dom.el('span', 'bi-tag', row, '使用');
        row.addEventListener('click', function () {
          G.inv.useConsumable(item.uid);
          U.renderInventory();
        });
      } else {
        G.dom.el('span', 'bi-tag', row, '素材');
      }
      row.title = U.itemTooltip(item);
    });
  };

  U.itemTooltip = function (item) {
    var lines = [];
    var qn = G.DATA.QUALITY_NAMES[(item.quality || 1) - 1];
    if (item.kind === 'gear') lines.push('[' + qn + '] ' + item.name);
    else lines.push(item.name);
    if (item.baseAtk) lines.push('攻击 +' + item.baseAtk);
    if (item.baseDef) lines.push('防御 +' + item.baseDef);
    if (item.affixes) {
      item.affixes.forEach(function (a) {
        var txt = a.fmt.replace('{v}', a.value).replace('{p}', (a.value * 100).toFixed(1));
        lines.push('  ' + a.name + '：' + txt);
      });
    }
    if (item.desc) lines.push('', item.desc);
    if (item.heal) lines.push('恢复 ' + item.heal + ' 生命');
    return lines.join('\n');
  };

  // =====================================================================
  // 商店渲染
  // =====================================================================
  U.openShop = function (shopId) {
    U.currentShop = G.DATA.SHOPS[shopId];
    U.panels.shop.style.display = '';
    U.shopTitle.textContent = U.currentShop.name;
    U.shopGreet.textContent = U.currentShop.greeting;
    U.renderShop();
  };

  U.renderShop = function () {
    var shop = U.currentShop;
    if (!shop) return;
    var st = G.player.state;
    var list = U.shopList;
    list.innerHTML = '';

    G.dom.el('div', 'shop-gold', list, '所持金：' + st.gold + ' 文');

    // 商品
    shop.stock.forEach(function (defId) {
      var def = G.DATA.ITEMS[defId];
      if (!def) return;
      var price = def.value;
      var row = G.dom.el('div', 'shoprow', list);
      G.dom.el('span', 'sr-name', row, def.name);
      G.dom.el('span', 'sr-price', row, price + ' 文');
      var btn = G.dom.el('button', 'sr-buy', row, '买入');
      btn.addEventListener('click', function () {
        if (st.gold < price) { U.toast('金币不足', 1200); return; }
        st.gold -= price;
        var item = G.inv.instantiate(defId);
        if (item) G.inv.add(item, 1);
        G.bus.emit('sfx', 'buy');
        U.toast('买入了 ' + def.name, 1200);
        U.renderShop();
        G.bus.emit('ui:dirty');
      });
    });

    // 重铸
    if (shop.reforge) {
      G.dom.el('div', 'shop-sep', list, '');
      G.dom.el('div', 'shop-h', list, '词条重铸（赌博）');
      G.dom.el('div', 'shop-note', list, '花金币重掷一件装备的全部词条。品质越高越贵。');

      var candidates = [];
      ['weapon', 'charm', 'robe'].forEach(function (s) {
        if (st.equip[s]) candidates.push(st.equip[s]);
      });
      st.bag.forEach(function (it) { if (it.kind === 'gear') candidates.push(it); });

      if (candidates.length === 0) {
        G.dom.el('div', 'shop-note', list, '（没有可重铸的装备）');
      }
      candidates.slice(0, 8).forEach(function (item) {
        var cost = G.inv.reforgeCost(item);
        var row = G.dom.el('div', 'shoprow reforge q' + item.quality, list);
        var info = G.dom.el('div', 'rf-info', row);
        G.dom.el('span', 'sr-name', info, item.name);
        var afText = (item.affixes || []).map(function (a) {
          return a.fmt.replace('{v}', a.value).replace('{p}', (a.value * 100).toFixed(1));
        }).join(' · ') || '（无词条）';
        G.dom.el('div', 'rf-affixes', info, afText);
        G.dom.el('span', 'sr-price', row, cost + ' 文');
        var btn = G.dom.el('button', 'sr-buy', row, '重铸');
        btn.addEventListener('click', function () {
          var res = G.inv.reforge(item.uid);
          if (res.ok) {
            U.toast('重铸完成！', 1400);
            U.renderShop();
            U.refreshHUD();
          } else {
            U.toast(res.msg, 1600);
          }
        });
      });
    }
  };

})(window.G = window.G || {});

</script>

<script>
/* 71-dialog.js — 对话运行时
 */
(function (G) {
  'use strict';

  var D = G.dlg = {};

  D.active = false;
  D.npc = null;
  D.data = null;
  D.lineIndex = 0;
  D.waitingChoice = false;
  D.openShopAfter = false;

  D.init = function () { };

  /**
   * 开始一段对话。
   * @param {object} npc 世界里的 NPC 对象
   * @param {object} dlgData G.DATA.DIALOGUES[...] 的数据
   * @param {boolean} shopAfter 结束对话后是否直接开店
   */
  D.start = function (npc, dlgData, shopAfter) {
    if (!dlgData) return;
    D.active = true;
    D.npc = npc;
    D.data = dlgData;
    D.lineIndex = 0;
    D.waitingChoice = false;
    D.openShopAfter = !!shopAfter;

    // 面向玩家
    if (npc && G.player.state) {
      npc.facing = Math.atan2(G.player.state.x - npc.x, G.player.state.z - npc.z);
    }

    G.ui.dialogEl.style.display = '';
    G.ui.dialogName.textContent = dlgData.speaker || (npc ? npc.def.name : '');
    G.ui.dialogChoices.innerHTML = '';
    D.showLine();
  };

  D.showLine = function () {
    var lines = D.data.lines || [];
    if (D.lineIndex >= lines.length) {
      D.showChoices();
      return;
    }
    G.ui.dialogText.textContent = lines[D.lineIndex];
    G.ui.dialogHint.style.display = '';
  };

  /** 点击/空格推进 */
  D.advance = function () {
    if (!D.active) return;
    if (D.waitingChoice) return;   // 选项状态下不能跳过

    var lines = D.data.lines || [];
    D.lineIndex++;
    if (D.lineIndex >= lines.length) {
      D.showChoices();
    } else {
      D.showLine();
    }
  };

  D.showChoices = function () {
    var choices = D.data.choices;

    if (!choices || choices.length === 0) {
      // 无选项：直接结束
      D.end();
      return;
    }

    D.waitingChoice = true;
    G.ui.dialogHint.style.display = 'none';
    var box = G.ui.dialogChoices;
    box.innerHTML = '';
    choices.forEach(function (c, i) {
      var b = G.dom.el('button', 'dlg-choice', box, c.text);
      b.addEventListener('click', function () {
        D.choose(c);
      });
    });
  };

  D.choose = function (choice) {
    D.waitingChoice = false;
    G.ui.dialogChoices.innerHTML = '';

    switch (choice.action) {
      case 'shop':
        D.end(true, choice.shopId);
        break;
      case 'goto':
        var next = G.DATA.DIALOGUES[choice.next];
        if (next) {
          D.data = next;
          D.lineIndex = 0;
          G.ui.dialogName.textContent = next.speaker || '';
          D.showLine();
        } else {
          D.end();
        }
        break;
      case 'close':
      default:
        D.end();
        break;
    }
  };

  D.end = function (skipShop, shopId) {
    D.active = false;
    var npc = D.npc;
    var data = D.data;
    D.npc = null;
    D.data = null;
    D.waitingChoice = false;
    G.ui.hideDialog();

    // 回调
    if (data && data.onEnd) {
      try { data.onEnd(); } catch (e) { console.error(e); }
    }

    // 任务对话完成
    if (npc && G.quest) G.quest.onTalk(npc.def.id);

    // 开店
    if (skipShop) {
      var sid = shopId || (npc && npc.def.shop);
      if (sid) G.ui.openShop(sid);
    }
  };

  /** 强制关闭（Esc） */
  D.close = function () {
    if (!D.active) return;
    D.active = false;
    D.npc = null;
    D.data = null;
    D.waitingChoice = false;
    G.ui.hideDialog();
  };

  // 点击对话框推进
  document.addEventListener('click', function (e) {
    if (!D.active) return;
    if (e.target.closest && e.target.closest('.dlg-choice')) return;
    if (e.target.closest && e.target.closest('.dialog')) {
      D.advance();
    }
  });

})(window.G = window.G || {});

</script>

<script>
/* 72-audio.js — WebAudio 程序化音频（零音频文件）
 *
 * BGM：都节音阶（D 都节：D Eb G A Bb）的五声循环 + 简单低音
 * SFX：合成波形（噪声/正弦/方波）+ 包络
 */
(function (G) {
  'use strict';

  var A = G.audio = {};

  A.ctx = null;
  A.master = null;
  A.enabled = true;
  A.bgmOn = true;
  A.bgmTimer = 0;
  A.bgmStep = 0;
  A.bgmPattern = [0, 2, 4, 5, 7, 5, 4, 2];  // 音级索引
  A.bgmRoot = 293.66;                        // D4
  A.bgmInterval = 0.62;

  // 都节音阶（半音偏移）：0, 1, 5, 7, 8
  var MIYAKO = [0, 1, 5, 7, 8, 12, 13, 17];

  A.init = function () {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { A.enabled = false; return; }
      A.ctx = new Ctx();
      A.master = A.ctx.createGain();
      A.master.gain.value = 0.32;
      A.master.connect(A.ctx.destination);

      // 用户第一次交互后恢复（浏览器策略）
      var resume = function () {
        if (A.ctx.state === 'suspended') A.ctx.resume();
        window.removeEventListener('pointerdown', resume);
        window.removeEventListener('keydown', resume);
      };
      window.addEventListener('pointerdown', resume);
      window.addEventListener('keydown', resume);

      A.startBGM();
    } catch (e) {
      console.warn('[audio] init failed', e);
      A.enabled = false;
    }
  };

  // =====================================================================
  // 基础合成
  // =====================================================================
  function env(gain, t0, attack, decay, peak, sustain) {
    var g = gain.gain;
    g.setValueAtTime(0, t0);
    g.linearRampToValueAtTime(peak, t0 + attack);
    g.exponentialRampToValueAtTime(Math.max(0.0001, sustain), t0 + attack + decay);
  }

  function tone(freq, dur, type, peak, opt) {
    if (!A.ctx || !A.enabled) return;
    opt = opt || {};
    var t0 = A.ctx.currentTime;
    var osc = A.ctx.createOscillator();
    var gain = A.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opt.slideTo) {
      osc.frequency.exponentialRampToValueAtTime(opt.slideTo, t0 + dur);
    }
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak != null ? peak : 0.2, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(opt.dest || A.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function noise(dur, peak, opt) {
    if (!A.ctx || !A.enabled) return;
    opt = opt || {};
    var t0 = A.ctx.currentTime;
    var len = Math.max(1, Math.floor(A.ctx.sampleRate * dur));
    var buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    var src = A.ctx.createBufferSource();
    src.buffer = buf;

    var filter = A.ctx.createBiquadFilter();
    filter.type = opt.filterType || 'bandpass';
    filter.frequency.setValueAtTime(opt.freq || 1200, t0);
    if (opt.freqTo) filter.frequency.exponentialRampToValueAtTime(opt.freqTo, t0 + dur);
    filter.Q.value = opt.q != null ? opt.q : 1.2;

    var gain = A.ctx.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak != null ? peak : 0.25, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(A.master);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  // =====================================================================
  // 音效表
  // =====================================================================
  A.play = function (id) {
    if (!A.enabled || !A.ctx) return;
    switch (id) {
      case 'slash':
        noise(0.13, 0.24, { freq: 2600, freqTo: 900, q: 0.9 });
        break;
      case 'hit':
        noise(0.09, 0.3, { freq: 900, freqTo: 220, q: 1.4 });
        tone(150, 0.09, 'square', 0.1, { slideTo: 70 });
        break;
      case 'hit_crit':
        noise(0.14, 0.34, { freq: 1600, freqTo: 300, q: 1.1 });
        tone(320, 0.12, 'square', 0.14, { slideTo: 110 });
        break;
      case 'dodge':
        noise(0.18, 0.16, { freq: 700, freqTo: 2200, q: 2.2 });
        break;
      case 'skill1':
        tone(520, 0.26, 'triangle', 0.2, { slideTo: 980 });
        noise(0.2, 0.18, { freq: 2800, freqTo: 700, q: 1.4 });
        break;
      case 'skill2':
        tone(220, 0.3, 'sawtooth', 0.13, { slideTo: 440 });
        noise(0.26, 0.2, { freq: 1400, freqTo: 500, q: 1.0 });
        break;
      case 'skill3':
        tone(880, 0.2, 'triangle', 0.16, { slideTo: 1600 });
        noise(0.14, 0.14, { freq: 3200, freqTo: 1400, q: 2 });
        break;
      case 'skill4':
        tone(330, 0.4, 'sine', 0.16);
        tone(495, 0.4, 'sine', 0.1);
        break;
      case 'parry_hit':
        tone(1200, 0.16, 'square', 0.22, { slideTo: 400 });
        noise(0.1, 0.3, { freq: 4000, freqTo: 1200, q: 2 });
        break;
      case 'player_hurt':
        tone(180, 0.2, 'sawtooth', 0.18, { slideTo: 90 });
        noise(0.16, 0.2, { freq: 500, freqTo: 180, q: 1 });
        break;
      case 'enemy_die':
        tone(300, 0.3, 'triangle', 0.12, { slideTo: 90 });
        noise(0.25, 0.14, { freq: 900, freqTo: 200, q: 0.8 });
        break;
      case 'enemy_cast':
        tone(400, 0.16, 'sine', 0.09, { slideTo: 200 });
        break;
      case 'levelup':
        [0, 4, 7, 12].forEach(function (semi, i) {
          setTimeout(function () {
            tone(523.25 * Math.pow(2, semi / 12), 0.26, 'triangle', 0.16);
          }, i * 90);
        });
        break;
      case 'pickup':
        tone(880, 0.1, 'sine', 0.13, { slideTo: 1320 });
        break;
      case 'pickup_rare':
        [0, 7, 12].forEach(function (semi, i) {
          setTimeout(function () {
            tone(659.25 * Math.pow(2, semi / 12), 0.3, 'triangle', 0.16);
          }, i * 70);
        });
        break;
      case 'chest':
        tone(440, 0.16, 'sine', 0.13);
        setTimeout(function () { tone(660, 0.24, 'sine', 0.13); }, 110);
        break;
      case 'heal':
        tone(660, 0.14, 'sine', 0.11, { slideTo: 990 });
        break;
      case 'gather':
        noise(0.14, 0.14, { freq: 1800, freqTo: 600, q: 1.4 });
        break;
      case 'equip':
        tone(520, 0.1, 'square', 0.08);
        break;
      case 'buy':
        tone(760, 0.1, 'sine', 0.1);
        setTimeout(function () { tone(1020, 0.14, 'sine', 0.08); }, 70);
        break;
      case 'reforge':
        [0, 3, 7].forEach(function (s, i) {
          setTimeout(function () { tone(520 * Math.pow(2, s / 12), 0.3, 'triangle', 0.12); }, i * 80);
        });
        break;
      case 'knot':
        [0, 5, 12].forEach(function (s, i) {
          setTimeout(function () { tone(392 * Math.pow(2, s / 12), 0.5, 'sine', 0.14); }, i * 140);
        });
        break;
      case 'skill_unlock':
        [0, 4, 7, 12, 16].forEach(function (s, i) {
          setTimeout(function () { tone(523.25 * Math.pow(2, s / 12), 0.4, 'triangle', 0.13); }, i * 100);
        });
        break;
      case 'boss_slam':
        tone(80, 0.5, 'sine', 0.28, { slideTo: 40 });
        noise(0.4, 0.24, { freq: 300, freqTo: 80, q: 0.7 });
        break;
      case 'ui':
        tone(720, 0.06, 'sine', 0.06);
        break;
    }
  };

  // =====================================================================
  // BGM：都节音阶的缓慢循环
  // =====================================================================
  A.startBGM = function () {
    if (!A.ctx) return;
    A.bgmNext = A.ctx.currentTime + 0.5;
  };

  A.update = function (dt) {
    if (!A.enabled || !A.ctx || !A.bgmOn) return;
    var now = A.ctx.currentTime;
    if (!A.bgmNext) return;

    // 提前调度
    while (A.bgmNext < now + 0.25) {
      A.scheduleBgmNote(A.bgmNext);
      A.bgmNext += A.bgmInterval;
      A.bgmStep++;
    }
  };

  A.scheduleBgmNote = function (t) {
    if (!A.ctx) return;
    var step = A.bgmStep % 16;
    var idx = A.bgmPattern[step % A.bgmPattern.length];
    var semi = MIYAKO[idx % MIYAKO.length];
    var freq = A.bgmRoot * Math.pow(2, semi / 12);

    // 主旋律
    if (step % 2 === 0) A.noteAt(freq, t, 0.85, 'triangle', 0.055);
    // 低八度
    if (step % 4 === 0) A.noteAt(freq / 2, t, 1.4, 'sine', 0.05);
    // 偶尔高音点缀
    if (step === 10) A.noteAt(freq * 2, t, 0.5, 'sine', 0.028);
  };

  A.noteAt = function (freq, t, dur, type, peak) {
    var osc = A.ctx.createOscillator();
    var gain = A.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(A.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  };

  A.toggleBGM = function () {
    A.bgmOn = !A.bgmOn;
    return A.bgmOn;
  };

})(window.G = window.G || {});

</script>
