  // ---------- 采集节点（矿/草药） ----------
  W.resourceNode = function (opt) {
    opt = opt || {};
    var g = new THREE.Group();
    var type = opt.type || 'herb';
    if (type === 'herb') {
      // 草药：几片叶子 + 小花
      for (var i = 0; i < 5; i++) {
        var a = (i / 5) * Math.PI * 2;
        var leaf = mesh(new THREE.PlaneGeometry(0.5, 0.16), G.PALETTE.moss,
          { side: THREE.DoubleSide });
        leaf.position.set(Math.cos(a) * 0.18, 0.18 + Math.random() * 0.06, Math.sin(a) * 0.18);
        leaf.rotation.set(-Math.PI / 2 + 0.5, a, 0);
        g.add(leaf);
      }
      var flower = mesh(new THREE.IcosahedronGeometry(0.14, 0), opt.color || '#E8A0B8',
        { steps: 3, darkness: 0.7 });
      flower.position.y = 0.42;
      g.add(flower);
    } else if (type === 'ore') {
      // 矿石：几块带金属感的石头
      for (var j = 0; j < 3; j++) {
        var rock = mesh(new THREE.DodecahedronGeometry(0.22 + j * 0.06, 0),
          j === 0 ? (opt.color || '#9AB0C0') : G.PALETTE.stone);
        rock.position.set((Math.random() - 0.5) * 0.4, 0.14 + j * 0.1, (Math.random() - 0.5) * 0.4);
        rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        g.add(rock);
      }
    }
    return g;
  };

  // ---------- 土路 ----------
  // 必须逐顶点贴合地形，否则在坡坎上会悬空或插进土里。
  // 用细分平面（默认 8x8 段足够）并按 height(x,z) 抬顶点。
  W.path = function (opt) {
    opt = opt || {};
    var w = opt.w || 4;
    var d = opt.d || 10;
    var segX = Math.max(2, Math.round(w / 0.6));
    var segZ = Math.max(2, Math.round(d / 0.6));

    var geo = new THREE.PlaneGeometry(w, d, segX, segZ);
    geo.rotateX(-Math.PI / 2);

    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      // 局部坐标 -> 世界坐标（group 会被放到 opt.x/opt.z）
      var lx = pos.getX(i);
      var lz = pos.getZ(i);
      var wx = lx + (opt.x || 0);
      var wz = lz + (opt.z || 0);
      pos.setY(i, G.terrain.height(wx, wz) + (opt.y || 0));
    }
    geo.computeVertexNormals();

    var tex = G.art.grassTexture({
      base: '#C9A87C',
      repeat: Math.max(2, Math.round(d / 4)),
      seed: (opt.seed || 3) + Math.round(opt.z || 0)
    });

    var mat = G.celMaterial('#FFFFFF', {
      steps: 3,
      darkness: 0.82,
      map: tex
    });
    // 修正 UV：默认 UV 是 0..1，贴图靠 texture.repeat 铺
    tex.repeat.set(1, 1);

    var m = new THREE.Mesh(geo, mat);
    m.receiveShadow = true;
    m.position.y = opt.y || 0;
    return m;
  };

  // ---------- 远景地标：五重塔 ----------
  // 目的：给野外一个"远看就知道往哪走"的视觉锚点。
  // 等距俯视下高塔的剪影最能打破地平线的单调。
  W.pagoda = function (opt) {
    opt = opt || {};
    var g = new THREE.Group();
    var tiers = opt.tiers || 5;
    var baseW = opt.baseW || 5.0;
    var bodyColor = opt.color || G.PALETTE.vermilionD;
    var roofColor = opt.roof || '#8A3A32';

    // 石基座
    var plinth = mesh(new THREE.BoxGeometry(baseW + 2.2, 0.7, baseW + 2.2), G.PALETTE.stone);
    plinth.position.y = 0.35;
    g.add(plinth);
    var plinth2 = mesh(new THREE.BoxGeometry(baseW + 1.2, 0.5, baseW + 1.2), G.PALETTE.stoneDark);
    plinth2.position.y = 0.95;
    g.add(plinth2);

    var y = 1.2;
    for (var i = 0; i < tiers; i++) {
      var t = i / Math.max(1, tiers - 1);
      var w = baseW * (1 - t * 0.52);
      var h = 1.5 * (1 - t * 0.22);

      var body = mesh(new THREE.BoxGeometry(w, h, w), bodyColor,
        { steps: 3, darkness: 0.88 });
      body.position.y = y + h / 2;
      g.add(body);

      // 屋檐（两块交叉薄板伪造四坡）
      // 檐宽不能太夸张：初版 eaveW = w + 1.5，导致视觉上几乎只看见檐、
      // 看不见塔身，整座塔读起来是一片暗红。收到 w + 0.9。
      var eaveW = w + 0.9;
      for (var k = 0; k < 2; k++) {
        var eave = mesh(new THREE.BoxGeometry(eaveW, 0.2, eaveW * 0.58),
          roofColor, { steps: 3, darkness: 0.9 });
        eave.position.y = y + h + 0.1;
        eave.rotation.y = k * Math.PI / 2;
        g.add(eave);
      }
      // 檐角翘起（小块，别喧宾夺主）
      for (var s = 0; s < 4; s++) {
        var a = s * Math.PI / 2 + Math.PI / 4;
        var tip = mesh(new THREE.BoxGeometry(0.6, 0.16, 0.6), roofColor,
          { steps: 3, darkness: 0.9 });
        tip.position.set(
          Math.cos(a) * eaveW * 0.4,
          y + h + 0.22,
          Math.sin(a) * eaveW * 0.4
        );
        tip.rotation.y = a;
        g.add(tip);
      }

      // 窗（发光）
      if (i < tiers - 1) {
        var winMat = G.celMaterial(G.PALETTE.lampGlow, {
          steps: 2, darkness: 0.92,
          emissive: G.PALETTE.lampGlow, emissiveIntensity: 0.4
        });
        var win = new THREE.Mesh(new THREE.BoxGeometry(w * 0.34, h * 0.42, 0.1), winMat);
        win.position.set(0, y + h * 0.5, w / 2 + 0.04);
        g.add(win);
      }

      y += h + 1.0;
    }

    // 相轮（顶端尖塔）
    var spire = mesh(new THREE.CylinderGeometry(0.14, 0.2, 3.2, 6), '#6B8A5A');
    spire.position.y = y + 1.4;
    g.add(spire);
    for (var r = 0; r < 4; r++) {
      var ring = mesh(new THREE.TorusGeometry(0.42 - r * 0.06, 0.07, 4, 10),
        G.PALETTE.gold, { steps: 3, darkness: 0.85 });
      ring.rotation.x = Math.PI / 2;
      ring.position.y = y + 0.5 + r * 0.55;
      g.add(ring);
    }

    g.userData.height = y;
    return g;
  };

  // ---------- 石灯笼（地标点缀） ----------
  //
  // 【重要观察】这类小物件在 640x360 画面里只占约 20~30 像素高。
  // 在这个尺寸下，64x64 的贴图细节会全部糊成一片，反而让物体发灰发脏。
  // 所以石灯笼的策略是：**不加贴图，用明度层次和形状说话**——
  //   - 石身用偏亮的暖灰（比原来提亮）
  //   - 灯窗用高亮自发光，形成强对比（这是等距小物件最有效的"辨识点"）
  //   - 顶盖用更深的色，形成三层明度梯队
  W.stoneLantern = function (opt) {
    opt = opt || {};
    var g = new THREE.Group();
    var s = opt.scale || 1;

    // 明度梯队：底座(中) -> 柱(亮) -> 灯窗(最亮) -> 盖(暗)
    // 提亮过一轮：初版 #B8B2A4/#D0CABC/#8A857A 在 Toon 暗部 +
    // 接地 AO 叠加后会整体发灰，和粉彩草地不协调。
    var stoneMid = '#CFC9BA';
    var stoneLight = '#E2DCCE';
    var stoneDark = '#A0998C';

    // 台座
    var pad = mesh(new THREE.CylinderGeometry(0.52 * s, 0.6 * s, 0.1 * s, 8), stoneDark);
    pad.position.y = 0.05 * s;
    g.add(pad);

    // 柱身：分段（下粗上细）+ 中段加一圈装饰环
    var lower = mesh(new THREE.CylinderGeometry(0.18 * s, 0.24 * s, 0.62 * s, 8), stoneLight);
    lower.position.y = 0.41 * s;
    g.add(lower);
    var ring = mesh(new THREE.CylinderGeometry(0.26 * s, 0.26 * s, 0.08 * s, 8), stoneMid);
    ring.position.y = 0.72 * s;
    g.add(ring);
    var upper = mesh(new THREE.CylinderGeometry(0.15 * s, 0.18 * s, 0.5 * s, 8), stoneLight);
    upper.position.y = 1.0 * s;
    g.add(upper);

    // 中台（承接灯室）
    var midBase = mesh(new THREE.CylinderGeometry(0.42 * s, 0.3 * s, 0.12 * s, 8), stoneMid);
    midBase.position.y = 1.3 * s;
    g.add(midBase);

    // 灯室：四角柱 + 三面开窗（自发光）
    var room = mesh(new THREE.BoxGeometry(0.62 * s, 0.5 * s, 0.62 * s), stoneMid);
    room.position.y = 1.61 * s;
    g.add(room);
    // 发光窗：三面（正面 + 两个侧面），用高亮自发光
    var winMat = G.celMaterial('#FFE9A8', {
      steps: 2, darkness: 1.0,
      emissive: '#FFD878', emissiveIntensity: 1.15
    });
    [[0, 0.32], [0.32, 0], [-0.32, 0]].forEach(function (off) {
      var win = new THREE.Mesh(new THREE.BoxGeometry(0.34 * s, 0.28 * s, 0.34 * s), winMat);
      if (off[0] !== 0) win.position.set(off[0] * s, 1.61 * s, 0);
      else win.position.set(0, 1.61 * s, off[1] * s);
      // 压扁成"窗"的厚度
      if (off[0] !== 0) win.scale.x = 0.06;
      else win.scale.z = 0.06;
      g.add(win);
    });

    // 顶盖：双层四坡，深色压住上沿
    var eave1 = mesh(new THREE.ConeGeometry(0.66 * s, 0.26 * s, 4), stoneDark);
    eave1.position.y = 1.94 * s;
    eave1.rotation.y = Math.PI / 4;
    g.add(eave1);
    var eave2 = mesh(new THREE.ConeGeometry(0.5 * s, 0.2 * s, 4), stoneMid);
    eave2.position.y = 2.1 * s;
    eave2.rotation.y = Math.PI / 4;
    g.add(eave2);

    // 宝顶
    var finial = mesh(new THREE.SphereGeometry(0.1 * s, 6, 5), stoneLight);
    finial.position.y = 2.26 * s;
    g.add(finial);

    var pl = new THREE.PointLight(0xFFE0A0, 0.9, 5.5, 2);
    pl.position.y = 1.61 * s;
    g.add(pl);
    g.userData.light = pl;
    return g;
  };

  // ---------- 草丛（贴地小物件，增加密度感） ----------
  W.grassTuft = function (opt) {
    opt = opt || {};
    var g = new THREE.Group();
    var col = opt.color || '#8AA96A';
    var h = 0.3 + ((opt.seed || 0) % 7) / 22;
    for (var i = 0; i < 3; i++) {
      var blade = mesh(
        new THREE.PlaneGeometry(0.11, h),
        col,
        { side: THREE.DoubleSide, steps: 3, darkness: 0.9 }
      );
      var a = (i / 3) * Math.PI + (opt.seed || 0) * 0.3;
      blade.position.set(Math.cos(a) * 0.07, h / 2, Math.sin(a) * 0.07);
      blade.rotation.y = a;
      blade.rotation.z = (i - 1) * 0.18;
      g.add(blade);
    }
    return g;
  };

  // ---------- 野花 ----------
  W.flower = function (opt) {
    opt = opt || {};
    var g = new THREE.Group();
    var col = opt.color || '#F7C8D8';
    var stem = mesh(new THREE.PlaneGeometry(0.05, 0.3), '#7FA85E',
      { side: THREE.DoubleSide });
    stem.position.y = 0.15;
    g.add(stem);
    var head = mesh(new THREE.IcosahedronGeometry(0.11, 0), col,
      { steps: 3, darkness: 0.88 });
    head.position.y = 0.34;
    g.add(head);
    return g;
  };

  // ---------- 传送点 / 神社 ----------
  W.shrine = function (opt) {
    opt = opt || {};
    var g = new THREE.Group();
    // 基座
    var base = mesh(new THREE.CylinderGeometry(1.2, 1.4, 0.3, 8), G.PALETTE.stone);
    base.position.y = 0.15;
    g.add(base);
    var base2 = mesh(new THREE.CylinderGeometry(0.95, 1.05, 0.25, 8), G.PALETTE.stoneDark);
    base2.position.y = 0.42;
    g.add(base2);
    // 石灯笼
    var post = mesh(new THREE.CylinderGeometry(0.16, 0.2, 1.2, 6), G.PALETTE.stone);
    post.position.y = 1.15;
    g.add(post);
    var box = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6),
      G.celMaterial(G.PALETTE.lampGlow, { steps: 2, darkness: 0.9, emissive: G.PALETTE.lampGlow, emissiveIntensity: 0.8 }));
    box.position.y = 1.9;
    g.add(box);
    var roof = mesh(new THREE.ConeGeometry(0.62, 0.4, 4), G.PALETTE.stoneDark);
    roof.position.y = 2.28;
    roof.rotation.y = Math.PI / 4;
    g.add(roof);
    var pl = new THREE.PointLight(0xFFE0A0, 1.2, 6, 2);
    pl.position.y = 1.9;
    g.add(pl);
    return g;
  };

  // ---------- 地面贴图（程序化草地） ----------
  W.grassTexture = function (opt) {
    opt = opt || {};
    var size = 64;
    var c = G.makeCanvas(size, size);
    var ctx = c.getContext('2d');
    var rnd = G.mulberry32(opt.seed || 5);
    // 底色
    ctx.fillStyle = opt.base || G.PALETTE.grass;
    ctx.fillRect(0, 0, size, size);
    // 深浅斑点
    for (var i = 0; i < 260; i++) {
      var x = Math.floor(rnd() * size);
      var y = Math.floor(rnd() * size);
      var v = rnd();
      ctx.fillStyle = v > 0.62
        ? G.col.shade(opt.base || G.PALETTE.grass, -0.14)
        : (v > 0.34 ? G.col.shade(opt.base || G.PALETTE.grass, 0.1)
                    : G.col.shade(opt.base || G.PALETTE.grass, 0.04));
      ctx.fillRect(x, y, rnd() > 0.8 ? 2 : 1, 1);
    }
    // 几撮草
    for (var g2 = 0; g2 < 26; g2++) {
      var gx = Math.floor(rnd() * size), gy = Math.floor(rnd() * size);
      ctx.fillStyle = G.col.shade(opt.base || G.PALETTE.grass, -0.22);
      ctx.fillRect(gx, gy, 1, 2);
      ctx.fillRect(gx + 1, gy + 1, 1, 1);
    }
    var tex = G.canvasTexture(c, true);
    tex.repeat.set(opt.repeat || 8, opt.repeat || 8);
    return tex;
  };

  /** 地面贴图的材质（Toon + 草地纹理）
   *
   * 踩过的坑：贴图本身已经画成了 base 色，材质 color 又设成同一个 base，
   * 结果 map × color 双重相乘 -> 草地变成暗橄榄绿、土路变成深棕。
   * 正确做法：材质 color 用白色（让贴图颜色原样透过）。
   */
  W.groundMaterial = function (colorHex, opt) {
    opt = opt || {};
    var tex = W.grassTexture({ base: colorHex, repeat: opt.repeat || 6, seed: opt.seed || 5 });
    return G.celMaterial('#FFFFFF', {
      steps: 3,
      darkness: 0.76,
      map: tex
    });
  };

})(window.G = window.G || {});

</script>

<script>
/* 22-sprite.js — billboard 立绘运行时
 *
 * 职责：
 *  - atlas 缓存（同一个 look + 同一套动作只构建一次）
 *  - 每帧根据"相对相机的方向"选 8 方向帧
 *  - 动画状态机（idle/walk/attack/hurt/dead）
 *  - 落地阴影贴片（billboard 不投影，用椭圆贴片代替）
 */
(function (G) {
  'use strict';

  var S = G.sprite = {};

  // ---------- atlas 缓存 ----------
  var atlasCache = {};
  var lookKeySeq = 0;

  function lookKey(look) {
    if (!look.__key) {
      var parts = [];
      for (var k in look) {
        if (k === '__key') continue;
        parts.push(k + '=' + look[k]);
      }
      look.__key = 'L' + (++lookKeySeq) + ':' + parts.join(',');
    }
    return look.__key;
  }

  /**
   * 取（或构建）某个外观的 atlas。
   * @param {object} look G.makeLook() 的结果
   * @param {string} tag  额外区分（一般传实体 id，让同外观不同实体共享）
   */
  G.getChibiAtlas = function (look, tag) {
    var key = lookKey(look);
    if (!atlasCache[key]) {
      atlasCache[key] = G.buildChibiAtlas(look);
    }
    return atlasCache[key];
  };

  // ---------- 动画表 ----------
  var PHASE_FRAMES = { idle: 2, walk: 4, attack: 3, hurt: 1, dead: 3 };
  var PHASE_FPS = { idle: 2.2, walk: 8, attack: 12, hurt: 10, dead: 6 };
  var PHASE_LOOP = { idle: true, walk: true, attack: false, hurt: false, dead: false };

  /** 计算"实体朝向"相对相机的 8 方向索引 */
  S.dirToCamera = function (facingAngle, cameraYaw) {
    // 屏幕方向 = 世界朝向 - 相机 yaw
    // 我们的 dir 定义：0 = 面向相机（南），顺时针
    var screenAngle = facingAngle - (cameraYaw + Math.PI);
    // 归一化到 -PI..PI
    while (screenAngle > Math.PI) screenAngle -= Math.PI * 2;
    while (screenAngle < -Math.PI) screenAngle += Math.PI * 2;
    // 0 -> 面向相机；注意 atan2 的 z 轴方向，需要翻转
    var idx = Math.round((screenAngle + Math.PI) / (Math.PI / 4));
    return ((idx % 8) + 8) % 8;
  };

  /** 简版：直接给世界朝向角（atan2(dz,dx)）和相机 yaw */
  S.dir8FromAngle = function (worldAngle, cameraYaw) {
    // 世界角度：0 = +x，PI/2 = +z
    // chibi 的 dir 0 = 面向相机 = 朝向 -z 方向（远离世界原点朝向相机）
    // 相机在 yaw 方向看向场景，所以"面向相机"的世界方向 = yaw + PI
    var faceCamAngle = cameraYaw + Math.PI;
    var rel = G.M.angleDelta(faceCamAngle, worldAngle);  // -PI..PI
    var idx = Math.round(rel / (Math.PI / 4));
    return ((idx % 8) + 8) % 8;
  };

  /**
   * 更新一个 sprite 的帧与朝向。
   * @param {THREE.Mesh} mesh  makeChibiMesh 的产物
   * @param {object} atlas
   * @param {number} dir8 0..7
   * @param {string} phase
   * @param {number} frame
   */
  S.update = function (mesh, atlas, dir8, phase, frame) {
    var info = atlas.frames[phase];
    if (!info) { phase = 'idle'; info = atlas.frames.idle; }
    var row = info.startRow + (frame % info.count);
    G.setChibiFrame(mesh, dir8, row);
    // 始终面向相机（等距下绕 Y 轴）
    if (G.camera.cam) {
      var cam = G.camera.cam;
      mesh.lookAt(cam.position.x, mesh.position.y, cam.position.z);
    }
  };

  // ---------- 动画状态机 ----------
  /**
   * 创建一个动画控制器，挂在实体上。
   */
  S.createAnimator = function () {
    return {
      phase: 'idle',
      frame: 0,
      t: 0,
      locked: false,       // attack/hurt/dead 期间锁定
      lockTimer: 0,
      hurtFlash: 0,
      set: function (phase, duration) {
        if (this.locked && phase !== 'dead') return;
        this.phase = phase;
        this.frame = 0;
        this.t = 0;
        if (phase === 'attack' || phase === 'hurt' || phase === 'dead') {
          this.locked = true;
          this.lockTimer = duration || (PHASE_FRAMES[phase] / PHASE_FPS[phase]);
        }
      },
      update: function (dt, moving) {
        if (this.locked) {
          this.lockTimer -= dt;
          var fps = PHASE_FPS[this.phase] || 8;
          this.t += dt;
          var frames = PHASE_FRAMES[this.phase] || 4;
          this.frame = Math.floor(this.t * fps);
          if (this.lockTimer <= 0 || this.frame >= frames) {
            if (this.phase === 'dead') {
              this.frame = frames - 1;
            } else {
              this.locked = false;
              this.phase = moving ? 'walk' : 'idle';
              this.frame = 0;
              this.t = 0;
            }
          }
        } else {
          var target = moving ? 'walk' : 'idle';
          if (this.phase !== target) {
            this.phase = target;
            this.frame = 0;
            this.t = 0;
          }
          this.t += dt;
          var f = PHASE_FPS[this.phase] || 4;
          var n = PHASE_FRAMES[this.phase] || 1;
          this.frame = Math.floor(this.t * f) % n;
        }
        if (this.hurtFlash > 0) this.hurtFlash -= dt;
      }
    };
  };

  // ---------- 落地阴影贴片 ----------
  var shadowTex = null;
  function getShadowTexture() {
    if (shadowTex) return shadowTex;
    var c = G.makeCanvas(32, 32);
    var ctx = c.getContext('2d');
    var grad = ctx.createRadialGradient(16, 16, 2, 16, 16, 15);
    grad.addColorStop(0, 'rgba(40,30,26,0.42)');
    grad.addColorStop(0.55, 'rgba(40,30,26,0.22)');
    grad.addColorStop(1, 'rgba(40,30,26,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    shadowTex = G.canvasTexture(c);
    return shadowTex;
  }

  /** 创建一个椭圆落地阴影（billboard 不投真实阴影，用这个代替） */
  S.makeShadow = function (w) {
    w = w || 1.05;
    var geo = new THREE.PlaneGeometry(w, w * 0.6);
    var mat = new THREE.MeshBasicMaterial({
      map: getShadowTexture(),
      transparent: true,
      depthWrite: false,
      opacity: 0.9
    });
    var m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.02;
    m.renderOrder = 1;
    return m;
  };

})(window.G = window.G || {});

</script>

<script>
/* 30-input.js — 键鼠输入
 * 等距视角：WASD 屏幕相对移动；鼠标左键普攻/指向；右键闪避；1-4 技能
 */
(function (G) {
  'use strict';

  var I = G.input = {
    keys: {},          // 物理按键 -> bool
    pressed: {},       // 本帧刚按下
    released: {},
    mouse: { x: 0, y: 0, worldX: 0, worldZ: 0, down: false, clicked: false, rightClicked: false },
    wheel: 0,
    enabled: true
  };

  var KEYMAP = {
    'KeyW': 'up', 'ArrowUp': 'up',
    'KeyS': 'down', 'ArrowDown': 'down',
    'KeyA': 'left', 'ArrowLeft': 'left',
    'KeyD': 'right', 'ArrowRight': 'right',
    'KeyJ': 'attack', 'Space': 'attack',
    'KeyK': 'dodge', 'ShiftLeft': 'dodge',
    'Digit1': 'skill1', 'Digit2': 'skill2',
    'Digit3': 'skill3', 'Digit4': 'skill4',
    'KeyE': 'interact', 'KeyF': 'interact',
    'KeyQ': 'rotateL', 'KeyR': 'rotateR',
    'KeyI': 'inventory', 'KeyM': 'map', 'KeyC': 'character',
    'Escape': 'escape', 'Tab': 'tab', 'KeyP': 'pause',
    'Enter': 'confirm'
  };

  var mouseDownButtons = {};

  I.init = function (canvas) {
    window.addEventListener('keydown', function (e) {
      if (!I.enabled) return;
      // 别拦截 F5/F12 等浏览器键
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var act = KEYMAP[e.code];
      if (act) {
        e.preventDefault();
        if (!I.keys[act]) I.pressed[act] = true;
        I.keys[act] = true;
      }
      // 防止空格滚动
      if (e.code === 'Space' || e.code === 'Tab') e.preventDefault();
    }, { passive: false });

    window.addEventListener('keyup', function (e) {
      var act = KEYMAP[e.code];
      if (act) {
        I.keys[act] = false;
        I.released[act] = true;
      }
    });

    // 失焦时清空按键，避免"卡住一直往前走"
    window.addEventListener('blur', function () {
      I.keys = {}; I.pressed = {};
      mouseDownButtons = {};
      I.mouse.down = false;
    });

    // 鼠标事件绑在 window 上而不是 canvas 上：
    // #ui 是全屏覆盖层（pointer-events:none 只对"没有 auto 的子元素"生效），
    // 绑 canvas 的话点击会被 UI 层吃掉 —— 踩过：点击画面完全不打怪。
    window.addEventListener('mousemove', function (e) {
      I.mouse.x = e.clientX;
      I.mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', function (e) {
      if (!I.enabled) return;
      // 点到会拦截指针的 UI（面板/对话框按钮）时，不当作游戏输入
      if (isUiTarget(e.target)) return;
      mouseDownButtons[e.button] = true;
      if (e.button === 0) { I.mouse.down = true; I.mouse.clicked = true; }
      if (e.button === 2) { I.mouse.rightClicked = true; }
      e.preventDefault();
    });

    window.addEventListener('mouseup', function (e) {
      mouseDownButtons[e.button] = false;
      if (e.button === 0) I.mouse.down = false;
    });

    window.addEventListener('contextmenu', function (e) {
      if (isUiTarget(e.target)) return;
      e.preventDefault();
    });

    window.addEventListener('wheel', function (e) {
      if (!I.enabled) return;
      if (isUiTarget(e.target)) return;
      I.wheel += Math.sign(e.deltaY);
      e.preventDefault();
    }, { passive: false });
  };

  /** 判断事件目标是否是"要吃指针的 UI" */
  function isUiTarget(el) {
    if (!el || !el.closest) return false;
    // 这些容器里的东西是玩家要点的，不能当游戏输入
    return !!el.closest('.overlay, .dialog, .dlg-choice, .sr-buy, .bagitem, .dlg-choices');
  }

  /** 每帧末尾调用，清空"刚按下"状态 */
  I.endFrame = function () {
    I.pressed = {};
    I.released = {};
    I.mouse.clicked = false;
    I.mouse.rightClicked = false;
    I.wheel = 0;
  };

  I.axis = function () {
    var x = 0, y = 0;
    if (I.keys.left) x -= 1;
    if (I.keys.right) x += 1;
    if (I.keys.up) y -= 1;
    if (I.keys.down) y += 1;
    // 归一化对角线
    if (x !== 0 && y !== 0) {
      var inv = Math.SQRT1_2;
      x *= inv; y *= inv;
    }
    return { x: x, y: y };
  };

  I.anyMove = function () {
    return !!(I.keys.left || I.keys.right || I.keys.up || I.keys.down);
  };

  // 触摸设备兜底：虚拟摇杆由 UI 提供，这里只暴露接口
  I.setVirtualAxis = function (x, y) {
    I._vt = { x: x, y: y };
    if (x < -0.3) I.keys.left = true; else I.keys.left = false;
    if (x > 0.3) I.keys.right = true; else I.keys.right = false;
    if (y < -0.3) I.keys.up = true; else I.keys.up = false;
    if (y > 0.3) I.keys.down = true; else I.keys.down = false;
  };

})(window.G = window.G || {});

</script>

<script>
/* 31-camera.js — 等距相机
 *
 * 俯角固定 ~35°，可绕 Y 轴 45° 步进旋转（Q/R）。
 * 用正交投影：等距视角的标准做法，而且远处物体不缩水，像素感统一。
 */
(function (G) {
  'use strict';

  var C = G.camera = {
    cam: null,
    yaw: Math.PI * 0.25,     // 45°
    pitch: 0.61,             // ~35°（弧度制：与水平面夹角）
    distance: 34,
    zoom: 1,
    target: new THREE.Vector3(0, 0, 0),
    follow: new THREE.Vector3(0, 0, 0),
    shake: { x: 0, y: 0, t: 0, amp: 0, dur: 0 },
    // 正交视口高度（世界单位）。
    // 踩过的坑：设成 15 时城镇半条街占满屏，看不到布局。
    // 24 大约能看到 2.5 个街区，配合 45° 俯角刚好。
    viewH: 24,
    yawTarget: Math.PI * 0.25,
    pitchOffset: 0
  };

  C.init = function (aspect) {
    var h = C.viewH;
    var w = h * aspect;
    C.cam = new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.1, 120);
    C.cam.position.set(0, 20, 20);
    C.cam.lookAt(0, 0, 0);
    return C.cam;
  };

  C.resize = function (aspect) {
    if (!C.cam) return;
    var h = C.viewH / C.zoom;
    var w = h * aspect;
    C.cam.left = -w / 2; C.cam.right = w / 2;
    C.cam.top = h / 2; C.cam.bottom = -h / 2;
    C.cam.updateProjectionMatrix();
  };

  C.rotateStep = function (dir) {
    C.yawTarget += dir * Math.PI / 4;
  };

  C.update = function (dt, followPos) {
    // 平滑朝向目标
    var d = G.M.angleDelta(C.yaw, C.yawTarget);
    C.yaw += d * Math.min(1, dt * 10);

    // 跟随点平滑
    if (followPos) {
      C.follow.x = G.M.lerp(C.follow.x, followPos.x, Math.min(1, dt * 8));
      C.follow.z = G.M.lerp(C.follow.z, followPos.z, Math.min(1, dt * 8));
      C.follow.y = G.M.lerp(C.follow.y, followPos.y || 0, Math.min(1, dt * 8));
    }

    // 屏震
    var sx = 0, sy = 0;
    if (C.shake.t > 0) {
      C.shake.t -= dt;
      var k = Math.max(0, C.shake.t / C.shake.dur);
      var amp = C.shake.amp * k * k;
      sx = (Math.random() * 2 - 1) * amp;
      sy = (Math.random() * 2 - 1) * amp;
    }

    var cx = C.follow.x, cy = C.follow.y, cz = C.follow.z;
    var hd = Math.cos(C.pitch) * C.distance;
    var vd = Math.sin(C.pitch) * C.distance;

    C.cam.position.set(
      cx + Math.sin(C.yaw) * hd + sx,
      cy + vd + sy,
      cz + Math.cos(C.yaw) * hd
    );
    C.cam.lookAt(cx + sx, cy, cz + sy);
    C.cam.updateProjectionMatrix();
  };

  C.shakeAdd = function (amp, dur) {
    if (C.shake.t <= 0 || amp > C.shake.amp) {
      C.shake.amp = amp;
      C.shake.dur = dur;
      C.shake.t = dur;
    }
  };

  /** 屏幕坐标 -> 地面(y=0) 世界坐标。用于鼠标指向技能。 */
  var _ray = new THREE.Raycaster();
  var _plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  var _ndc = new THREE.Vector2();
  var _hit = new THREE.Vector3();

  C.screenToGround = function (screenX, screenY) {
    if (!C.cam) return { x: 0, z: 0 };
    // 关键：raycaster 依赖相机的世界矩阵。update() 里只改了 position/lookAt，
    // 矩阵要到下一次渲染才刷新，这里必须手动强制更新，
    // 否则鼠标指向会用到上一帧的相机（踩过：攻击朝向差了 135°）
    C.cam.updateMatrixWorld(true);
    var canvas = G.pixels.renderer.domElement;
    var rect = canvas.getBoundingClientRect();
    _ndc.x = ((screenX - rect.left) / rect.width) * 2 - 1;
    _ndc.y = -((screenY - rect.top) / rect.height) * 2 + 1;
    _ray.setFromCamera(_ndc, C.cam);
    var out = _ray.ray.intersectPlane(_plane, _hit);
    if (!out) return { x: C.follow.x, z: C.follow.z };
    return { x: _hit.x, z: _hit.z };
  };

  /** 世界坐标 -> 屏幕像素（用于伤害数字的锚定） */
  C.worldToScreen = function (wx, wy, wz) {
    if (!C.cam) return { x: 0, y: 0 };
    // 同样要强制刷新矩阵，否则伤害数字会飘（用上一帧相机）
    C.cam.updateMatrixWorld(true);
    var v = new THREE.Vector3(wx, wy, wz);
    v.project(C.cam);
    var canvas = G.pixels.renderer.domElement;
    var rect = canvas.getBoundingClientRect();
    return {
      x: rect.left + (v.x * 0.5 + 0.5) * rect.width,
      y: rect.top + (-v.y * 0.5 + 0.5) * rect.height
    };
  };

  /**
   * 屏幕方向的意图 -> 世界方向（WASD 的屏幕相对移动）。
   *
   * 【事故记录：方向完全反向】
   * 初版是靠"看着 yaw 手推"写的：
   *     var rx = -cos, rz = sin;   // 以为这是屏幕右
   *     var fx = -sin, fz = -cos;  // 以为这是往画面里
   * 实测（用相机世界矩阵取真实基向量对比）四个键全部反向：
   *     W 走了 180° 反方向，D 也反了。
   * 手推正交相机基向量太容易出错，改为直接读相机矩阵：
   *   - 相机局部 +X 投到地面 = 屏幕右
   *   - 相机局部 +Y 投到地面 = 画面上（即"往画面里走"）
   * 这样无论 yaw 怎么变、相机怎么绕都不会再错。
   */
  var _m4 = new THREE.Matrix4();
  var _vRight = new THREE.Vector3();
  var _vUp = new THREE.Vector3();

  C.screenDirToWorld = function (sx, sz) {
    if (!C.cam) return { x: 0, z: 0 };
    C.cam.updateMatrixWorld(true);

    _m4.extractRotation(C.cam.matrixWorld);
    // 屏幕右：相机局部 +X
    _vRight.set(1, 0, 0).applyMatrix4(_m4);
    // 画面上：相机局部 +Y（投到地面平面即为"往画面里"）
    _vUp.set(0, 1, 0).applyMatrix4(_m4);

    // 投到 XZ 平面并归一化
    var rl = Math.hypot(_vRight.x, _vRight.z) || 1;
    var ul = Math.hypot(_vUp.x, _vUp.z) || 1;
    var rx = _vRight.x / rl, rz = _vRight.z / rl;
    var fx = _vUp.x / ul, fz = _vUp.z / ul;

    // sx = 屏幕右为正，sz = 屏幕下为正（W 传 -1，S 传 +1）
    // 屏幕下 = 画面上取反
    var wx = rx * sx + fx * (-sz);
    var wz = rz * sx + fz * (-sz);
    return G.M.norm(wx, wz);
  };

})(window.G = window.G || {});

</script>

<script>
/* 40-player.js — 玩家控制与状态
 */
(function (G) {
  'use strict';

  var M = G.M;

  var P = G.player = {
    state: null,
    mesh: null,
    atlas: null,
    shadow: null,
    anim: null,
    look: null
  };

  P.init = function (saveData) {
    var look = G.makeLook(saveData && saveData.appearance);
    P.look = look;
    var atlas = G.getChibiAtlas(look, 'player');
    P.atlas = atlas;

    var mesh = G.makeChibiMesh(atlas, { worldH: 2.5 });
    P.mesh = mesh;
    G.world.scene.add(mesh);

    var shadow = G.sprite.makeShadow(1.15);
    G.world.scene.add(shadow);
    P.shadow = shadow;

    P.anim = G.sprite.createAnimator();

    var sp = G.DATA.WORLD.spawn;
    // 注意：不能用 (x) || sp.x —— 坐标 0 是合法值，0 || sp.x 会误判。
    // 必须显式判断 null/undefined。
    function pick(saved, fallback) {
      return (saved === null || saved === undefined) ? fallback : saved;
    }
    var savedPos = (saveData && saveData.position) || null;
    var st = {
      name: (saveData && saveData.name) || '旅人',
      x: pick(savedPos && savedPos.x, sp.x),
      z: pick(savedPos && savedPos.z, sp.z),
      facing: Math.PI,          // 世界角度：面向南（屏幕下方）
      vx: 0, vz: 0,
      speed: 7.4,
      hp: 100, maxHp: 100,
      mp: 0, maxMp: 0,
      level: (saveData && saveData.level) || 1,
      exp: (saveData && saveData.exp) || 0,
      expNext: 0,
      gold: (saveData && saveData.gold) || 0,
      atk: 10, def: 2, crit: 0.08, critMult: 1.8,
      attackCd: 0, attackCdMax: 0.42,
      invuln: 0,
      hitFlash: 0,
      dead: false,
      respawnTimer: 0,
      dodge: { cd: 0, cdMax: 1.1, timer: 0, dirX: 0, dirZ: 0, invuln: 0 },
      skills: {},             // id -> {cd}
      skillUnlocked: {},
      equip: { weapon: null, charm: null, robe: null },
      bag: [],
      buffs: [],
      // 战斗时序（给渲染层读）
      attackAnim: 0,
      moveLock: 0
    };
    P.state = st;
    P.recalcStats();
    st.hp = st.maxHp;

    // 初始技能
    st.skillUnlocked[1] = true;
    st.skillUnlocked[2] = true;

    return st;
  };

  /** 根据等级与装备重算属性 */
  P.recalcStats = function () {
    var st = P.state;
    var lv = st.level;
    var baseAtk = 10 + (lv - 1) * 2.2;
    var baseDef = 2 + (lv - 1) * 0.6;
    var baseHp = 100 + (lv - 1) * 18;

    var eq = st.equip;
    var bonus = { atk: 0, def: 0, hp: 0, crit: 0, speed: 0, lifesteal: 0 };
    var slots = ['weapon', 'charm', 'robe'];
    for (var i = 0; i < slots.length; i++) {
      var item = eq[slots[i]];
      if (!item) continue;
      if (item.baseAtk) bonus.atk += item.baseAtk;
      if (item.baseDef) bonus.def += item.baseDef;
      if (item.affixes) {
        for (var a = 0; a < item.affixes.length; a++) {
          var af = item.affixes[a];
          var val = af.value;
          if (af.stat === 'atk') bonus.atk += val;
          else if (af.stat === 'def') bonus.def += val;
          else if (af.stat === 'hp') bonus.hp += val;
          else if (af.stat === 'crit') bonus.crit += val;
          else if (af.stat === 'speed') bonus.speed += val;
          else if (af.stat === 'lifesteal') bonus.lifesteal += val;
        }
      }
    }

    st.atk = Math.round(baseAtk + bonus.atk);
    st.def = Math.round(baseDef + bonus.def);
    st.maxHp = Math.round(baseHp + bonus.hp);
    // 踩过的坑：写成 Math.min(0.75, st.critMultBase || 0.08 + bonus.crit)
    // 因为 || 优先级低于 +，实际算的是 (critMultBase || 0.08) + bonus.crit，
    // 而且 st.critMult 从未被赋值 -> 暴击时 dmg *= undefined -> NaN
    var baseCrit = 0.08;
    st.crit = Math.min(0.75, Math.max(0, baseCrit + bonus.crit));
    st.critMult = st.critMult != null ? st.critMult : 1.8;
    st.moveSpeedMul = 1 + bonus.speed;
    st.lifesteal = bonus.lifesteal;
    st.expNext = Math.round(40 * Math.pow(1.28, lv - 1));
    if (st.hp > st.maxHp) st.hp = st.maxHp;
  };

  // =====================================================================
  // 每帧更新
  // =====================================================================
  P.update = function (dt, input, camera) {
    var st = P.state;
    if (!st) return;

    // 死亡
    if (st.dead) {
      st.respawnTimer -= dt;
      if (st.respawnTimer <= 0) P.respawn();
      P.syncVisual(dt, false);
      return;
    }

    // 计时器
    st.invuln = Math.max(0, st.invuln - dt);
    st.attackCd = Math.max(0, st.attackCd - dt);
    st.hitFlash = Math.max(0, st.hitFlash - dt);
    st.moveLock = Math.max(0, st.moveLock - dt);
    st.attackAnim = Math.max(0, st.attackAnim - dt);
    if (st.dodge.cd > 0) st.dodge.cd -= dt;
    if (st.dodge.timer > 0) {
      st.dodge.timer -= dt;
      st.dodge.invuln = Math.max(0, st.dodge.invuln - dt);
    }
    // 技能冷却
    for (var sk in st.skills) {
      if (st.skills[sk].cd > 0) st.skills[sk].cd = Math.max(0, st.skills[sk].cd - dt);
    }
    // buff 计时
    for (var b = st.buffs.length - 1; b >= 0; b--) {
      st.buffs[b].t -= dt;
      if (st.buffs[b].t <= 0) st.buffs.splice(b, 1);
    }
    // 生命自然回复（城镇内更快）
    if (G.world.inTown(st.x, st.z)) {
      st.hp = Math.min(st.maxHp, st.hp + dt * (st.maxHp * 0.06));
    } else {
      st.hp = Math.min(st.maxHp, st.hp + dt * (st.maxHp * 0.012));
    }

    // ---- 输入 ----
    var moving = false;

    // 翻滚中：锁定移动方向
    if (st.dodge.timer > 0) {
      var t = st.dodge.timer / 0.28;
      var sp = st.speed * 2.6 * Math.max(0.25, t);
      st.vx = st.dodge.dirX * sp;
      st.vz = st.dodge.dirZ * sp;
      moving = true;
    } else {
      var ax = input.axis();
      var dir = camera.screenDirToWorld(ax.x, ax.y);
      var mag = Math.sqrt(ax.x * ax.x + ax.y * ax.y);
      if (mag > 0.05) {
        var terr = G.world.terrainSpeed(st.x, st.z);
        var spd = st.speed * (st.moveSpeedMul || 1) * terr;
        st.vx = dir.x * spd;
        st.vz = dir.z * spd;
        st.facing = Math.atan2(dir.x, dir.z);  // 面向移动方向
        moving = true;
      } else {
        st.vx *= Math.pow(0.001, dt);
        st.vz *= Math.pow(0.001, dt);
      }
    }

    // 位移 + 碰撞
    var nx = st.x + st.vx * dt;
    var nz = st.z + st.vz * dt;
    var res = G.world.resolveCollision(nx, nz, 0.34);
    st.x = res.x;
    st.z = res.z;

    // ---- 闪避 ----
    if ((input.pressed.dodge || input.mouse.rightClicked) && st.dodge.cd <= 0 && st.dodge.timer <= 0) {
      P.dodge();
    }

    // ---- 攻击 ----
    if ((input.mouse.down || input.keys.attack) && st.attackCd <= 0 && st.moveLock <= 0) {
      P.basicAttack(input, camera);
    }

    // ---- 技能 ----
    if (input.pressed.skill1) P.useSkill(1, input, camera);
    if (input.pressed.skill2) P.useSkill(2, input, camera);
    if (input.pressed.skill3) P.useSkill(3, input, camera);
    if (input.pressed.skill4) P.useSkill(4, input, camera);

    // ---- 相机旋转 ----
    if (input.pressed.rotateL) camera.rotateStep(1);
    if (input.pressed.rotateR) camera.rotateStep(-1);

    P.syncVisual(dt, moving);
  };

  /** 视觉同步（billboard 朝向、动画、阴影） */
  P.syncVisual = function (dt, moving) {
    var st = P.state;
    var mesh = P.mesh;
    if (!mesh) return;

    mesh.position.x = st.x;
    mesh.position.z = st.z;
    // 贴地：脚下高度 + 半身高。
    // 注意：半身高必须与世界高度（2.5）一致，否则角色陷地/浮空。
    // 踩过：worldH 从 2.05 改到 2.5 时忘了同步这里，角色半截入土。
    var gy = G.world.groundY(st.x, st.z);
    var halfH = 1.25;   // = worldH / 2
    mesh.position.y = st.dead ? gy + 0.6 : gy + halfH;

    // 翻滚时压扁提示
    if (st.dodge.timer > 0) {
      mesh.position.y = gy + 0.9;
    }

    var dir8 = G.sprite.dir8FromAngle(st.facing, G.camera.yaw);
    P.anim.update(dt, moving);
    // 受击/死亡优先
    if (st.dead && P.anim.phase !== 'dead') {
      P.anim.set('dead', 999);
    }
    if (st.hitFlash > 0.12 && !P.anim.locked && !st.dead) {
      P.anim.set('hurt', 0.22);
    }
    if (st.attackAnim > 0 && !P.anim.locked && !st.dead) {
      P.anim.set('attack', 0.24);
    }
    G.sprite.update(mesh, P.atlas, dir8, P.anim.phase, P.anim.frame);

    // 阴影
    P.shadow.position.x = st.x;
    P.shadow.position.z = st.z;
    P.shadow.position.y = G.world.groundY(st.x, st.z) + 0.02;
    P.shadow.visible = !st.dead;
    var sc = st.dodge.timer > 0 ? 1.2 : 1;
    P.shadow.scale.setScalar(sc);

    // 受伤闪红（材质颜色）
    var mat = mesh.material;
    if (st.invuln > 0) {
      mat.color.setHex(0xFFFFFF);
      mat.opacity = 0.55 + Math.sin(performance.now() * 0.03) * 0.25;
    } else if (st.hitFlash > 0) {
      mat.color.setHex(0xFFAA99);
      mat.opacity = 1;
    } else {
      mat.color.setHex(0xFFFFFF);
      mat.opacity = 1;
    }
  };

  // =====================================================================
  // 动作
  // =====================================================================
  P.dodge = function () {
    var st = P.state;
    var input = G.input;
    var ax = input.axis();
    var dir = G.camera.screenDirToWorld(ax.x, ax.y);
    if (ax.x === 0 && ax.y === 0) {
      // 无输入则朝当前朝向
      dir = { x: Math.sin(st.facing), z: Math.cos(st.facing) };
    }
    st.dodge.dirX = dir.x;
    st.dodge.dirZ = dir.z;
    st.dodge.timer = 0.28;
    st.dodge.cd = st.dodge.cdMax;
    st.dodge.invuln = 0.25;
    st.invuln = Math.max(st.invuln, 0.25);
    G.bus.emit('sfx', 'dodge');
    // 残影
    G.fx.ghost(st.x, st.z, P.atlas, st.facing, 'walk', 1);
  };

  P.basicAttack = function (input, camera) {
    var st = P.state;
    st.attackCd = st.attackCdMax;
    st.attackAnim = 0.24;
    st.moveLock = 0.16;

    // 朝鼠标方向
    var g = camera.screenToGround(input.mouse.x, input.mouse.y);
    var dx = g.x - st.x, dz = g.z - st.z;
    var len = Math.sqrt(dx * dx + dz * dz);
    if (len > 0.2) {
      st.facing = Math.atan2(dx, dz);
      // 小幅突进
      var dash = Math.min(1.5, len) * 0.28;
      var n = M.norm(dx, dz);
      var res = G.world.resolveCollision(st.x + n.x * dash, st.z + n.z * dash, 0.34);
      st.x = res.x; st.z = res.z;
    }

    var dmg = st.atk * (0.9 + Math.random() * 0.25);
    var crit = Math.random() < st.crit;
    if (crit) dmg *= st.critMult;

    // 踩过的坑：曾调用不存在的 G.combat.slash()，普攻静默失效。
    // 普攻就是一次扇形判定 + 挥击特效。
    var hits = G.combat.cone({
      x: st.x, z: st.z,
      angle: st.facing,
      arc: Math.PI * 0.75,
      radius: 2.3,
      damage: dmg,
      crit: crit,
      critMult: st.critMult,
      source: 'player',
      knockback: 3.2,
      hitstopMs: crit ? 70 : 45,
      element: 'blade'
    });

    G.player.flashAttackVfx(st.x, st.z, st.facing);
    G.bus.emit('sfx', crit ? 'hit_crit' : 'slash');
    G.camera.shakeAdd(crit ? 0.28 : 0.16, 0.12);
    return hits;
  };

  /** 挥刀特效：一个扇形拖影 */
  P.flashAttackVfx = function (x, z, angle) {
    G.fx.slashArc(x, z, angle, 2.3, Math.PI * 0.75);
  };

  P.useSkill = function (n, input, camera) {
    var st = P.state;
    if (!st.skillUnlocked[n]) {
      G.ui.toast('还未习得这个技能');
      return;
    }
    var def = G.DATA.SKILLS[n];
    if (!def) return;
    var cdState = st.skills[n] || (st.skills[n] = { cd: 0 });
    if (cdState.cd > 0) return;

    // 朝鼠标方向
    var g = camera.screenToGround(input.mouse.x, input.mouse.y);
    var dx = g.x - st.x, dz = g.z - st.z;
    var ang = Math.atan2(dx, dz);
    if (Math.abs(dx) + Math.abs(dz) > 0.3) st.facing = ang;

    var ok = G.skills.cast(n, def, st, ang, { x: g.x, z: g.z });
    if (ok) {
      cdState.cd = def.cooldown;
      G.bus.emit('ui:skillcd', { n: n, cd: def.cooldown, max: def.cooldown });
    }
  };

  // =====================================================================
  // 受击 / 死亡
  // =====================================================================
  P.takeDamage = function (amount, opts) {
    var st = P.state;
    if (st.dead) return 0;
    if (st.invuln > 0 || st.dodge.invuln > 0) return 0;

    opts = opts || {};
    var dmg = Math.max(1, amount * (100 / (100 + st.def * 8)));
    dmg = Math.round(dmg);
    st.hp -= dmg;
    st.hitFlash = 0.28;
    st.invuln = opts.invuln || 0.35;

    G.fx.damageNumber(st.x, 1.6, st.z, dmg, { playerTaking: true });
    G.camera.shakeAdd(0.3, 0.15);
    G.bus.emit('sfx', 'player_hurt');
    G.ui.flashHurt();

    if (st.hp <= 0) {
      st.hp = 0;
      P.die();
    }
    return dmg;
  };

  P.die = function () {
    var st = P.state;
    st.dead = true;
    st.respawnTimer = 1.6;
    P.anim.set('dead', 999);
    G.bus.emit('player:died');
    // 掉落：地上未拾取的东西消失由 pickup 系统处理
    G.loot.dropAll();
    G.ui.toast('你倒下了……回結ノ町醒来', 2600);
  };

  P.respawn = function () {
    var st = P.state;
    var sp = G.DATA.WORLD.spawn;
    st.dead = false;
    st.hp = st.maxHp;
    st.x = sp.x;
    st.z = sp.z;
    st.invuln = 2.0;
    st.dodge.timer = 0;
    P.anim.phase = 'idle';
    P.anim.locked = false;
    G.bus.emit('player:respawn');
    G.ui.toast('你在結ノ町醒来了');
  };

  P.gainExp = function (amount) {
    var st = P.state;
    st.exp += amount;
    while (st.exp >= st.expNext && st.level < 10) {
      st.exp -= st.expNext;
      st.level++;
      P.recalcStats();
      st.hp = st.maxHp;
      G.ui.saveNotice = true;
      G.ui.toast('等级提升！ Lv.' + st.level, 2200);
      G.fx.levelUp(st.x, st.z);
      G.bus.emit('sfx', 'levelup');
      G.bus.emit('player:levelup', st.level);
    }
    if (st.level >= 10) { st.exp = Math.min(st.exp, st.expNext); }
  };

})(window.G = window.G || {});

</script>

<script>
/* 41-enemy.js — 怪物 AI 与运行时
 *
 * AI 类型：
 *   chaser  - 直线追击，贴脸前摇攻击
 *   ranged  - 保持距离投射
 *   pack    - 群居，仇恨联动
 *   tank    - 慢、血厚、有格挡姿态
 *   boss    - 分阶段，多招式
 */
(function (G) {
  'use strict';

  var M = G.M;
  var E = G.enemy = {
    list: [],
    nextId: 1
  };

  /**
   * 生成一只怪。
   */
  E.spawn = function (defId, x, z, zone) {
    var def = G.DATA.MONSTERS[defId];
    if (!def) return null;

    var look = G.makeLook(def.look);
    var atlas = G.getChibiAtlas(look, defId);
    var mesh = G.makeChibiMesh(atlas, { worldH: (def.height || 1.7) * 1.05 });
    mesh.position.set(x, G.world.groundY(x, z) + (def.height || 1.7) * 0.5 + (def.floatOffset || 0), z);
    G.world.scene.add(mesh);

    var shadow = G.sprite.makeShadow(def.radius * 2.2);
    shadow.position.set(x, G.world.groundY(x, z) + 0.02, z);
    G.world.scene.add(shadow);

    var anim = G.sprite.createAnimator();

    // 血量条（世界空间贴片）
    var bar = E.makeHpBar(def);

    var e = {
      id: E.nextId++,
      defId: defId,
      def: def,                 // 定义对象（只读）
      defStat: def.def || 0,    // 防御数值（避免 e.def 命名歧义）
      x: x, z: z,
      hp: def.hp, maxHp: def.hp,
      radius: def.radius, height: def.height,
      facing: Math.PI,
      mesh: mesh, atlas: atlas, shadow: shadow, anim: anim, hpBar: bar,
      state: 'idle',            // idle | chase | windup | attack | hurt | dead
      stateTimer: 0,
      attackCd: Math.random() * def.attackCd,
      telegraph: 0,
      knockX: 0, knockZ: 0, knockT: 0,
      hitFlash: 0,
      dead: false,
      deadTimer: 0,
      zone: zone,
      exp: def.exp, goldMin: def.goldMin, goldMax: def.goldMax,
      phase: 0,
      // boss 用
      moveTimer: 0,
      summonCount: 0
    };

    mesh.userData.entity = e;
    G.sprite.update(mesh, atlas, 4, 'idle', 0);
    E.list.push(e);
    return e;
  };

  /** 血条：一个始终面向相机的小平面 + canvas 纹理 */
  E.makeHpBar = function (def) {
    var c = G.makeCanvas(64, 8);
    var ctx = c.getContext('2d');
    var tex = G.canvasTexture(c);
    var mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false, depthTest: false
    });
    var w = def.tier === 'boss' ? 2.6 : (def.tier === 'elite' ? 1.4 : 1.0);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 0.125), mat);
    m.renderOrder = 999;
    m.visible = false;
    G.world.scene.add(m);
    return { mesh: m, canvas: c, ctx: ctx, tex: tex, w: w };
  };

  E.drawHpBar = function (e) {
    var bar = e.hpBar;
    if (!bar) return;
    var ctx = bar.ctx;
    var W = 64, H = 8;
    ctx.clearRect(0, 0, W, H);
    var pct = Math.max(0, e.hp / e.maxHp);
    // 底
    ctx.fillStyle = 'rgba(30,24,22,0.72)';
    ctx.fillRect(0, 0, W, H);
    // 血
    var col = e.def.tier === 'boss' ? '#D9A0E8'
      : (e.def.tier === 'elite' ? '#E8C25A' : '#E05A4F');
    ctx.fillStyle = col;
    ctx.fillRect(1, 1, Math.floor((W - 2) * pct), H - 2);
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(1, 1, Math.floor((W - 2) * pct), 2);
    bar.tex.needsUpdate = true;
  };

  // =====================================================================
  // 每帧更新
  // =====================================================================
  E.update = function (dt, player) {
    var st = player.state;
    for (var i = E.list.length - 1; i >= 0; i--) {
      var e = E.list[i];
      E.updateOne(e, dt, st);

      if (e.dead) {
        e.deadTimer -= dt;
        // 死亡淡出
        var t = Math.max(0, e.deadTimer / 0.9);
        e.mesh.material.opacity = t;
        e.mesh.position.y = (e.def.height || 1.7) * 0.5 * t;
        e.shadow.material.opacity = 0.9 * t;
        if (e.hpBar) e.hpBar.mesh.visible = false;
        if (e.deadTimer <= 0) {
          E.remove(e);
          E.list.splice(i, 1);
        }
      }
    }
  };

  E.updateOne = function (e, dt, st) {
    var def = e.def;
    if (e.dead) return;

    // 计时器
    e.attackCd = Math.max(0, e.attackCd - dt);
    e.hitFlash = Math.max(0, e.hitFlash - dt);
    e.stateTimer = Math.max(0, e.stateTimer - dt);

    // 击退
    if (e.knockT > 0) {
      e.knockT -= dt;
      e.x += e.knockX * dt;
      e.z += e.knockZ * dt;
      e.knockX *= Math.pow(0.02, dt);
      e.knockZ *= Math.pow(0.02, dt);
    }

    var dx = st.x - e.x, dz = st.z - e.z;
    var dist = Math.sqrt(dx * dx + dz * dz);
    var playerAlive = !st.dead;

    // 死亡/玩家死亡时不再行动
    if (!playerAlive) {
      e.state = 'idle';
      E.syncVisual(e, dt, false, st);
      return;
    }

    // ---- 状态机 ----
    switch (e.state) {
      case 'idle':
        if (dist < def.aggroRange) {
          e.state = 'chase';
          // 群居联动：唤醒附近同群
          if (def.ai === 'pack') E.wakePack(e);
        } else {
          // 游荡
          e.wanderT = (e.wanderT || 0) - dt;
          if (e.wanderT <= 0) {
            e.wanderT = 2 + Math.random() * 3;
            e.wanderDx = (Math.random() - 0.5) * 2;
            e.wanderDz = (Math.random() - 0.5) * 2;
          }
          if (e.wanderDx || e.wanderDz) {
            e.x += e.wanderDx * dt * 0.5;
            e.z += e.wanderDz * dt * 0.5;
            e.facing = Math.atan2(e.wanderDx, e.wanderDz);
          }
        }
        break;

      case 'chase':
        e.facing = Math.atan2(dx, dz);
        if (dist > def.aggroRange * 1.7) {
          e.state = 'idle';
          break;
        }
        if (E.inAttackRange(def, dist)) {
          if (e.attackCd <= 0) {
            e.state = 'windup';
            e.stateTimer = def.telegraphSec;
            e.telegraph = def.telegraphSec;
          }
        } else {
          // 移动到攻击距离
          var spd = def.speed;
          if (def.ai === 'ranged' && dist < def.attackRange * 0.7) {
            spd = -spd * 0.8;   // 太近则后退
          }
          var n = M.norm(dx, dz);
          var nx = e.x + n.x * spd * dt;
          var nz = e.z + n.z * spd * dt;
          var res = G.world.resolveCollision(nx, nz, e.radius);
          e.x = res.x; e.z = res.z;
        }
        break;

      case 'windup':
        // 前摇：站定，可读
        if (e.telegraph > 0) {
          e.telegraph -= dt;
          // 前摇最后一帧才真正出手
          if (e.telegraph <= 0) {
            E.doAttack(e, st, dist);
            e.state = 'chase';
            e.attackCd = def.attackCd;
          }
        } else {
          e.state = 'chase';
        }
        break;
    }

    // boss 阶段
    if (def.ai === 'boss') E.updateBoss(e, dt, st, dist);

    E.syncVisual(e, dt, true, st);
  };

  E.inAttackRange = function (def, dist) {
    return dist <= def.attackRange + def.radius * 0.5;
  };

  /** 怪物的攻击 */
  E.doAttack = function (e, st, dist) {
    var def = e.def;
    if (def.ai === 'ranged') {
      // 发射投射物
      var ang = Math.atan2(st.x - e.x, st.z - e.z);
      G.projectiles.add({
        x: e.x, z: e.z,
        dirX: Math.sin(ang), dirZ: Math.cos(ang),
        speed: def.projectileSpeed || 8,
        range: 16, traveled: 0, radius: 0.45,
        damage: def.atk, source: 'enemy',
        color: def.id === 'yurei' ? '#C8B0E0' : '#E8A0A8',
        pierce: 0, hit: [],
        hitstopMs: 0
      });
      G.bus.emit('sfx', 'enemy_cast');
      return;
    }

    // 近战：先做朝向判定（玩家在正面扇形内才吃伤害）
    var da = Math.abs(M.angleDelta(e.facing, Math.atan2(st.x - e.x, st.z - e.z)));
    var reach = def.attackRange + 0.8;
    if (dist <= reach && da <= Math.PI * 0.42) {
      G.combat.hitPlayer(def.atk, e.x, e.z, { knockback: 1.4 });
      G.fx.slashArc(e.x, e.z, e.facing, reach, Math.PI * 0.7);
    } else {
      // 落空：仍然播特效，让玩家看到"刚才没打中"
      G.fx.slashArc(e.x, e.z, e.facing, reach, Math.PI * 0.7);
    }
  };

  /** 怪物对玩家造成伤害（真正入口） */
  E.hitPlayer = function (e, st) {
    var def = e.def;
    G.combat.hitPlayer(def.atk, e.x, e.z, { knockback: def.knockback || 1.2 });
  };

  E.wakePack = function (e) {
    for (var i = 0; i < E.list.length; i++) {
      var o = E.list[i];
      if (o === e || o.dead) continue;
      if (o.defId !== e.defId) continue;
      if (M.dist(e.x, e.z, o.x, o.z) < 10) {
        o.state = 'chase';
      }
    }
  };

  // =====================================================================
  // Boss
  // =====================================================================
  E.updateBoss = function (e, dt, st, dist) {
    var def = e.def;
    var hpPct = e.hp / e.maxHp;
    e.moveTimer -= dt;

    // 阶段切换
    var newPhase = 0;
    for (var i = 0; i < def.phases.length; i++) {
      if (hpPct <= def.phases[i].hpBelow) newPhase = i;
    }
    if (newPhase !== e.phase) {
      e.phase = newPhase;
      G.ui.bossPhase(e, newPhase);
    }

    // 召唤阶段
    if (def.phases[e.phase].move === 'summon' && e.moveTimer <= 0 && e.summonCount < 4) {
      e.moveTimer = 9;
      e.summonCount++;
      for (var s = 0; s < 2; s++) {
        var a = Math.random() * Math.PI * 2;
        var sx = e.x + Math.cos(a) * 3.5;
        var sz = e.z + Math.sin(a) * 3.5;
        var minion = E.spawn('onibi', sx, sz, null);
        if (minion) { minion.state = 'chase'; }
      }
      G.ui.toast('結びの神 召唤了鬼火', 1600);
    }

    // AOE 重击阶段
    if (def.phases[e.phase].move === 'aoe_slam' && e.moveTimer <= 0) {
      e.moveTimer = 5.5;
      G.ui.bossTelegraph(e, 1.1);
      setTimeout(function () {
        if (e.dead || !G.world.scene) return;
        var d = M.dist(e.x, e.z, G.player.state.x, G.player.state.z);
        if (d < 6.5) {
          G.combat.hitPlayer(def.atk * 2.2, e.x, e.z, { knockback: 3 });
        }
        G.fx.impactRing(e.x, e.z, 6.5, '#D9A0E8');
        G.camera.shakeAdd(0.6, 0.4);
        G.bus.emit('sfx', 'boss_slam');
      }, 1100);
    }
  };

  // =====================================================================
  // 视觉同步
  // =====================================================================
  E.syncVisual = function (e, dt, active, st) {
    var def = e.def;
    var mesh = e.mesh;
    mesh.position.x = e.x;
    mesh.position.z = e.z;
    var gy = G.world.groundY(e.x, e.z);
    var baseY = gy + (def.height || 1.7) * 0.5;
    if (def.floatOffset) {
      baseY += def.floatOffset + Math.sin(performance.now() * 0.002 + e.id) * 0.12;
    }
    mesh.position.y = baseY;

    var moving = active && e.state === 'chase';
    e.anim.update(dt, moving);

    // 前摇时压暗/放大提示
    if (e.state === 'windup') {
      var k = 1 + Math.sin(performance.now() * 0.03) * 0.06;
      mesh.scale.set(k, 1 / k, 1);
    } else {
      mesh.scale.set(1, 1, 1);
    }

    var dir8 = G.sprite.dir8FromAngle(e.facing, G.camera.yaw);
    G.sprite.update(mesh, e.atlas, dir8, e.anim.phase, e.anim.frame);

    // 阴影
    e.shadow.position.x = e.x;
    e.shadow.position.z = e.z;
    e.shadow.position.y = G.world.groundY(e.x, e.z) + 0.02;
    e.shadow.visible = !e.dead;

    // 受击闪红
    var mat = mesh.material;
    if (e.hitFlash > 0) {
      mat.color.setHex(0xFF9A8A);
    } else if (e.state === 'windup') {
      mat.color.setHex(0xFFC8C0);
    } else {
      mat.color.setHex(0xFFFFFF);
    }

    // 血条
    if (e.hpBar) {
      var showBar = e.hp < e.maxHp && !e.dead;
      e.hpBar.mesh.visible = showBar;
      if (showBar) {
        var barY = G.world.groundY(e.x, e.z) + (def.height || 1.7) + 0.35;
        e.hpBar.mesh.position.set(e.x, barY, e.z);
        if (G.camera.cam) {
          e.hpBar.mesh.lookAt(G.camera.cam.position.x, barY, G.camera.cam.position.z);
        }
        E.drawHpBar(e);
      }
    }
  };

  // =====================================================================
  // 死亡
  // =====================================================================
  E.kill = function (e, opts) {
    if (e.dead) return;
    e.dead = true;
    e.deadTimer = 0.9;
    e.anim.set('dead', 999);
    e.mesh.material.transparent = true;
    if (e.hpBar) e.hpBar.mesh.visible = false;

    // 掉落
    var def = e.def;
    G.loot.spawnFromTable(def.loot, e.x, e.z, def);

    // 经验
    G.player.gainExp(def.exp);

    G.bus.emit('enemy:killed', { defId: e.defId, x: e.x, z: e.z });
    G.bus.emit('sfx', 'enemy_die');
    G.fx.impactRing(e.x, e.z, 1.2, '#E8C25A');

    // 任务进度
    if (G.quest) G.quest.onKill(e.defId);
  };

  E.remove = function (e) {
    if (e.mesh.parent) e.mesh.parent.remove(e.mesh);
    if (e.shadow.parent) e.shadow.parent.remove(e.shadow);
    if (e.hpBar && e.hpBar.mesh.parent) e.hpBar.mesh.parent.remove(e.hpBar.mesh);
    if (e.mesh.geometry) e.mesh.geometry.dispose();
    if (e.mesh.material) e.mesh.material.dispose();
  };

  E.clear = function () {
    for (var i = 0; i < E.list.length; i++) E.remove(E.list[i]);
    E.list.length = 0;
  };

  /** 最近的敌人（用于锁定/UI） */
  E.nearest = function (x, z, maxDist) {
    var best = null, bestD = maxDist || 99;
    for (var i = 0; i < E.list.length; i++) {
      var e = E.list[i];
      if (e.dead) continue;
      var d = M.dist(x, z, e.x, e.z);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  };

})(window.G = window.G || {});

</script>

<script>
/* 42-skills.js — 技能实现 */
(function (G) {
  'use strict';

  var M = G.M;

  var S = G.skills = {};

  /** 已激活的持续效果（格挡等） */
  S.activeEffects = [];

  /**
   * 施放技能。
   * @returns {boolean} 是否成功施放
   */
  S.cast = function (n, def, st, angle, target) {
    switch (def.type) {
      case 'dash_slash':
        S.dashSlash(def, st, angle);
        return true;
      case 'aoe_ring':
        S.aoeRing(def, st, angle);
        return true;
      case 'projectile':
        S.projectile(def, st, angle, target);
        return true;
      case 'parry':
        S.parry(def, st, angle);
        return true;
    }
    return false;
  };

  // ---------- 抜刀・月影：瞬身前斩 ----------
  S.dashSlash = function (def, st, angle) {
    var nx = Math.sin(angle), nz = Math.cos(angle);
    var fromX = st.x, fromZ = st.z;

    // 冲刺位移
    var tx = st.x + nx * def.dashDist;
    var tz = st.z + nz * def.dashDist;
    var res = G.world.resolveCollision(tx, tz, 0.34);
    st.x = res.x; st.z = res.z;
    st.invuln = Math.max(st.invuln, 0.18);
    st.moveLock = 0.22;

    // 残影
    G.fx.dashTrail(fromX, fromZ, st.x, st.z, '#B8DCE8');

    // 命中判定：扇形
    G.combat.cone({
      x: st.x, z: st.z, angle: angle, arc: def.arc, radius: def.radius,
      damage: st.atk * def.damageMult,
      crit: Math.random() < st.crit,
      critMult: st.critMult,
      source: 'player',
      knockback: 4.5,
      hitstopMs: def.hitstopMs,
      element: 'blade'
    });

    // 视觉
    G.fx.moonSlash(st.x, st.z, angle, def.radius);
    G.camera.shakeAdd(def.shake, 0.18);
    G.bus.emit('sfx', def.sfx);
    st.attackAnim = 0.3;
  };

  // ---------- 斬鉄・輪：环斩 ----------
  S.aoeRing = function (def, st, angle) {
    G.combat.ring({
      x: st.x, z: st.z, radius: def.radius,
      damage: st.atk * def.damageMult,
      crit: Math.random() < st.crit,
      critMult: st.critMult,
      source: 'player',
      knockback: def.knockback,
      hitstopMs: def.hitstopMs,
      element: 'blade'
    });
    G.fx.ringSlash(st.x, st.z, def.radius);
    G.camera.shakeAdd(def.shake, 0.2);
    G.bus.emit('sfx', def.sfx);
    st.attackAnim = 0.28;
    st.moveLock = 0.2;
    st.invuln = Math.max(st.invuln, 0.12);
  };

  // ---------- 飛刃・風切り：投射物 ----------
  S.projectile = function (def, st, angle, target) {
    G.projectiles.add({
      x: st.x, z: st.z,
      dirX: Math.sin(angle), dirZ: Math.cos(angle),
      speed: def.speed,
      range: def.range,
      traveled: 0,
      radius: 0.5,
      damage: st.atk * def.damageMult,
      crit: Math.random() < st.crit,
      critMult: st.critMult,
      pierce: def.pierce,
      hit: [],
      hitstopMs: def.hitstopMs,
      source: 'player',
      color: '#B8DCE8'
    });
    G.bus.emit('sfx', def.sfx);
    st.attackAnim = 0.22;
    G.camera.shakeAdd(0.1, 0.08);
  };

  // ---------- 受け流し：格挡反击 ----------
  S.parry = function (def, st, angle) {
    st.parry = {
      timer: def.duration,
      def: def,
      used: false
    };
    G.fx.parryAura(st.x, st.z);
    G.bus.emit('sfx', def.sfx);
    st.attackAnim = 0.2;
    st.moveLock = 0.15;
    G.ui.toast('受け流し — 架刀', 700);
  };

  /** 每帧更新持续效果（由主循环调用） */
  S.update = function (dt, st) {
    if (st.parry) {
      st.parry.timer -= dt;
      if (st.parry.timer <= 0) {
        st.parry = null;
      }
    }
  };

  /** 受到攻击时调用；若在格挡窗口内，触发反击 */
  S.tryParry = function (st, attacker) {
    if (!st.parry || st.parry.used) return false;
    st.parry.used = true;
    var def = st.parry.def;

    // 反击
    if (attacker && attacker.mesh) {
      var ax = attacker.x, az = attacker.z;
      var ang = Math.atan2(ax - st.x, az - st.z);
      G.combat.cone({
        x: st.x, z: st.z, angle: ang, arc: Math.PI * 0.5, radius: def.radius,
        damage: st.atk * def.damageMult,
        crit: true, critMult: st.critMult,
        source: 'player',
        knockback: def.knockback,
        hitstopMs: def.hitstopMs,
        element: 'blade'
      });
      G.fx.parryFlash(st.x, st.z, ang);
      G.camera.shakeAdd(def.shake, 0.24);
      G.bus.emit('sfx', 'parry_hit');
      G.ui.toast('見切り！', 900);
      G.hitstop.trigger(0.12);
    }
    st.parry = null;
    st.invuln = Math.max(st.invuln, 0.3);
    return true;
  };

})(window.G = window.G || {});

</script>

<script>
/* 44-combat.js — 战斗判定与打击反馈
 *
 * 四种判定：cone（扇形）、ring（环形）、line（直线）、point（点）
 * 四件套：hitstop / 屏震 / 伤害数字 / 受击闪白+击退
 */
(function (G) {
  'use strict';

  var M = G.M;

  var C = G.combat = {};

  // ---------- 命中收集 ----------
  /** 收集范围内的敌人 */
  function enemiesInCone(x, z, angle, arc, radius, includeDead) {
    var out = [];
    var list = G.enemy.list;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.dead && !includeDead) continue;
      var dx = e.x - x, dz = e.z - z;
      var d = Math.sqrt(dx * dx + dz * dz);
      if (d > radius + e.radius) continue;
      if (arc < Math.PI * 2) {
        var ea = Math.atan2(dx, dz);
        var da = Math.abs(M.angleDelta(angle, ea));
        if (da > arc / 2) continue;
      }
      out.push({ enemy: e, dist: d });
    }
    return out;
  }

  function enemiesInRing(x, z, radius, includeDead) {
    var out = [];
    var list = G.enemy.list;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.dead && !includeDead) continue;
      var d = M.dist(x, z, e.x, e.z);
      if (d <= radius + e.radius) out.push({ enemy: e, dist: d });
    }
    return out;
  }

  // ---------- 应用伤害 ----------
  /**
   * 对一个敌人结算伤害。
   * @returns {number} 实际伤害
   */
  C.hitEnemy = function (e, damage, opts) {
    if (e.dead) return 0;
    opts = opts || {};

    // 注意命名歧义：e.def 是怪物定义对象，e.defStat 才是防御数值。
    // 踩过：写成 e.def * 0.6 -> 对象乘数字 -> NaN -> 敌人血量变 NaN。
    var defense = e.defStat || 0;
    var dmg = Math.max(1, damage - defense * 0.6);
    dmg = Math.round(dmg);
    if (!isFinite(dmg)) dmg = Math.max(1, Math.round(damage) || 1);

    e.hp -= dmg;
    e.hitFlash = 0.2;

    // 击退
    if (opts.knockback && opts.fromX != null) {
      var n = M.norm(e.x - opts.fromX, e.z - opts.fromZ);
      e.knockX = n.x * opts.knockback;
      e.knockZ = n.z * opts.knockback;
      e.knockT = 0.18;
    }

    // 伤害数字
    G.fx.damageNumber(e.x, e.height || 1.5, e.z, dmg, {
      crit: opts.crit,
      element: opts.element
    });

    // 受击动画
    if (e.anim) e.anim.set('hurt', 0.18);

    // hitstop
    if (opts.hitstopMs) G.hitstop.trigger(opts.hitstopMs / 1000);

    // 吸血
    if (opts.lifesteal && opts.lifesteal > 0) {
      var st = G.player.state;
      st.hp = Math.min(st.maxHp, st.hp + dmg * opts.lifesteal);
    }

    if (e.hp <= 0) {
      G.enemy.kill(e, opts);
    }
    return dmg;
  };

  // ---------- 判定形状 ----------
  /**
   * 扇形判定。
   */
  C.cone = function (p) {
    var hits = enemiesInCone(p.x, p.z, p.angle, p.arc, p.radius);
    var total = 0;
    for (var i = 0; i < hits.length; i++) {
      var h = hits[i];
      var dmg = p.damage;
      var crit = false;
      if (p.critMult && Math.random() < (p.crit ? 1 : 0)) { crit = true; }
      // 简单：p.crit 决定是否暴击（由调用方掷骰）
      if (p.crit) { dmg *= (p.critMult || 1.8); crit = true; }
      var real = C.hitEnemy(h.enemy, dmg, {
        crit: crit,
        element: p.element,
        knockback: p.knockback,
        fromX: p.x, fromZ: p.z,
        hitstopMs: i === 0 ? p.hitstopMs : 0,
        lifesteal: G.player.state.lifesteal
      });
      total += real;
    }
    if (hits.length > 0) {
      G.bus.emit('sfx', 'hit');
      G.camera.shakeAdd(0.12 + Math.min(0.25, hits.length * 0.05), 0.1);
    }
    return total;
  };

  /**
   * 环形判定。
   */
  C.ring = function (p) {
    var hits = enemiesInRing(p.x, p.z, p.radius);
    var total = 0;
    for (var i = 0; i < hits.length; i++) {
      var dmg = p.damage * (p.crit ? (p.critMult || 1.8) : 1);
      total += C.hitEnemy(hits[i].enemy, dmg, {
        crit: p.crit,
        element: p.element,
        knockback: p.knockback,
        fromX: p.x, fromZ: p.z,
        hitstopMs: i === 0 ? p.hitstopMs : 0,
        lifesteal: G.player.state.lifesteal
      });
    }
    if (hits.length > 0) {
      G.bus.emit('sfx', 'hit');
      G.camera.shakeAdd(0.18 + Math.min(0.3, hits.length * 0.06), 0.14);
    }
    return total;
  };

  /**
   * 直线判定（投射物用，逐个点检查）。
   */
  C.hitscanLine = function (x0, z0, dx, dz, range, radius) {
    // 简化：沿射线采样，收集被扫到的敌人
    var seen = {}, out = [];
    var steps = Math.ceil(range / 0.5);
    for (var i = 1; i <= steps; i++) {
      var t = (i / steps) * range;
      var px = x0 + dx * t, pz = z0 + dz * t;
      var hits = enemiesInRing(px, pz, radius + 0.4);
      for (var h = 0; h < hits.length; h++) {
        var e = hits[h].enemy;
        if (!seen[e.id]) { seen[e.id] = true; out.push(e); }
      }
    }
    return out;
  };

  // ---------- 玩家受伤 ----------
  C.hitPlayer = function (damage, srcX, srcZ, opts) {
    opts = opts || {};
    var st = G.player.state;
    if (st.dead) return 0;

    // 格挡？
    if (G.skills.tryParry(st, { x: srcX, z: srcZ, mesh: true, height: 1.5 })) {
      return 0;
    }

    var real = G.player.takeDamage(damage, opts);
    if (real > 0 && opts.knockback) {
      var n = M.norm(st.x - srcX, st.z - srcZ);
      st.vx += n.x * opts.knockback * 3;
      st.vz += n.z * opts.knockback * 3;
    }
    return real;
  };

  // ---------- 命中停顿 ----------
  var HITSTOP_MAX = 0.2;   // 单次停顿上限，超过必然是 bug

  G.hitstop = {
    timer: 0,
    trigger: function (sec) {
      // 钳制：防止某次调用传了巨大的值把游戏永久冻住
      if (!isFinite(sec) || sec <= 0) return;
      var clamped = Math.min(sec, HITSTOP_MAX);
      // 取较长的那个，避免重复触发叠加过久
      if (clamped > this.timer) this.timer = clamped;
    },
    update: function (dt) {
      if (this.timer > 0) {
        this.timer -= dt;
        if (this.timer < 0) this.timer = 0;
        return true;   // 表示这一帧处于停顿
      }
      return false;
    },
    reset: function () { this.timer = 0; }
  };

})(window.G = window.G || {});

</script>

<script>
/* 45-vfx.js — 打击特效与屏幕反馈
 *
 * 全部用程序化几何 + 材质动画实现，无贴图资源。
 *
 * 【2026-11 修复：出村后特效"范围异常/被吞"】
 * 根因：所有特效的 y 都是写死的常量（0.30 / 0.35 / 0.40），
 * 而野外地面高度从 1.04 一路升到 8.96。特效被埋在地下最多 8.56 单位，
 * 玩家只能看到它从土里露出来的一小条，看起来像"范围不对"或"没打出来"。
 * 城镇地面恒为 0，所以村里完全正常 —— 和你观察到的现象一致。
 *
 * 修法：把"贴地"变成特效的默认行为，用 G.world.groundY(x,z) + 相对高度。
 * 同时新增 vfxY() 供所有特效统一取值，避免以后再加特效时又写死数字。
 */
(function (G) {
  'use strict';

  var M = G.M;
  var V = G.fx = {};

  var active = [];       // 活动特效
  var damageNumbers = []; // DOM 伤害数字

  /**
   * 特效的统一高度：地面高度 + 相对抬升。
   * 所有特效都必须走这里，不要写死数字（踩过：写死 0.35 导致野外全埋地下）。
   */
  V.atGround = function (x, z, lift) {
    return G.world.groundY(x, z) + (lift || 0);
  };

  /** 调试用：当前活动特效数量 */
  V.activeCount = function () { return active.length; };

  V.clear = function () {
    for (var i = 0; i < active.length; i++) {
      // 延迟项没有 obj，只有创建回调；直接丢弃即可
      if (active[i].obj && active[i].obj.parent) {
        active[i].obj.parent.remove(active[i].obj);
      }
    }
    active.length = 0;
    for (var j = 0; j < damageNumbers.length; j++) {
      var d = damageNumbers[j];
      if (d.el && d.el.parentNode) d.el.parentNode.removeChild(d.el);
    }
    damageNumbers.length = 0;
  };

  function add(obj, life, update) {
    G.world.scene.add(obj);
    active.push({ obj: obj, life: life, maxLife: life, update: update });
  }

  /**
   * 延迟创建特效 —— 替代 setTimeout。
   *
   * 【为什么要改】setTimeout 不受帧循环管辖：
   *   - hitstop 期间它照常触发（停顿感被破坏）
   *   - 切后台/暂停时它仍在跑
   *   - 场景重建后它可能往旧 scene 里加对象
   * 改为挂进 active 队列，由 update(dt) 驱动。
   */
  function delayed(sec, fn) {
    var pending = { obj: null, life: sec, maxLife: sec, delay: fn, isDelay: true };
    active.push(pending);
  }

  // =====================================================================
  // 扇形斩击
  // =====================================================================
  V.slashArc = function (x, z, angle, radius, arc) {
    var geo = new THREE.RingGeometry(radius * 0.25, radius, 16, 1,
      angle - arc / 2 - Math.PI / 2, arc);
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#FFFFFF'),
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, V.atGround(x, z, 0.35), z);
    add(m, 0.16, function (t, self) {
      self.material.opacity = 0.72 * (1 - t) * (1 - t);
      self.scale.setScalar(1 + t * 0.15);
    });
  };

  // =====================================================================
  // 月影斩（技能1）：更大更亮的一道
  // =====================================================================
  V.moonSlash = function (x, z, angle, radius) {
    // 两层错开 45ms 出现。用帧循环延迟而不是 setTimeout：
    // setTimeout 不受 hitstop 管辖，停顿期间照常触发，破坏打击感；
    // 而且在低帧率下会和渲染节拍错开，看起来像"两刀只出现一刀"。
    for (var k = 0; k < 2; k++) {
      (function (layerIndex, delaySec) {
        delayed(delaySec, function () {
          if (!G.world.scene) return;
          var geo = new THREE.RingGeometry(radius * 0.3, radius * 1.1, 20, 1,
            angle - Math.PI * 0.36 - Math.PI / 2, Math.PI * 0.72);
          var mat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(layerIndex === 0 ? '#DCEFFF' : '#B8DCE8'),
            transparent: true,
            // 同 ringSlash：0.85 在亮背景上过曝成白块，降到 0.5
            opacity: 0.5,
            side: THREE.DoubleSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });
          var m = new THREE.Mesh(geo, mat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(x, V.atGround(x, z, 0.4 + layerIndex * 0.12), z);
          add(m, 0.28, function (t, self) {
            self.material.opacity = 0.5 * (1 - t) * (1 - t);
            self.scale.setScalar(1 + t * 0.25);
          });
        });
      })(k, k * 0.045);
    }
    // 中心爆点
    V.impactRing(x, z, radius * 0.8, '#DCEFFF');
  };

  // =====================================================================
  // 环斩（技能2）
  // =====================================================================
  V.ringSlash = function (x, z, radius) {
    var geo = new THREE.RingGeometry(radius * 0.82, radius * 1.05, 28);
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#FFE9A8'),
      transparent: true,
      // 0.9 在明亮草地上配合 AdditiveBlending 会过曝成纯白块，
      // 把地面和角色全糊住（截图确认）。0.55 能看清攻击判定圈又不挡视线。
      opacity: 0.55,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, V.atGround(x, z, 0.3), z);
    add(m, 0.32, function (t, self) {
      // 二次曲线淡出：前段保持亮度，后段快速消失，比线性更有"打击"感
      self.material.opacity = 0.55 * (1 - t) * (1 - t);
      var s = 1 + t * 0.35;
      self.scale.set(s, 1, s);
    });
  };

  // =====================================================================
  // 冲击环（通用）
  // =====================================================================
  V.impactRing = function (x, z, radius, color) {
    var geo = new THREE.RingGeometry(radius * 0.6, radius, 20);
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(color || '#FFFFFF'),
      transparent: true, opacity: 0.8,
      side: THREE.DoubleSide, depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, V.atGround(x, z, 0.25), z);
    add(m, 0.3, function (t, self) {
      self.material.opacity = 0.8 * (1 - t);
      var s = 1 + t * 1.2;
      self.scale.set(s, 1, s);
    });
  };

  // =====================================================================
  // 冲刺残影
  // =====================================================================
  V.dashTrail = function (x0, z0, x1, z1, color) {
    var dx = x1 - x0, dz = z1 - z0;
    var len = Math.sqrt(dx * dx + dz * dz);
    if (len < 0.1) return;
    var geo = new THREE.PlaneGeometry(len, 1.6);
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(color || '#B8DCE8'),
      transparent: true, opacity: 0.42,
      depthWrite: false, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.position.set((x0 + x1) / 2, 1.0, (z0 + z1) / 2);
    m.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
    add(m, 0.22, function (t, self) {
      self.material.opacity = 0.42 * (1 - t);
    });
  };

  // =====================================================================
  // 角色残影（chibi 立绘的淡出副本）
  // =====================================================================
  V.ghost = function (x, z, atlas, facing, phase, frame) {
    if (!atlas || !atlas.frames) return;
    var mat = new THREE.MeshBasicMaterial({
      map: atlas.tex,
      transparent: true,
      opacity: 0.4,
      alphaTest: 0.4,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    var w = 2.05 * (atlas.cw / atlas.ch);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, 2.05), mat);
    m.position.set(x, V.atGround(x, z, 1.02), z);
    // 关键：setChibiFrame 从 mesh.userData.atlas 读 w/h 信息，
    // 残影是临时 mesh，必须挂上去（踩过：不挂 -> atlas undefined -> 报错）
    m.userData.atlas = atlas;
    var dir8 = G.sprite.dir8FromAngle(facing, G.camera.yaw);
    var info = atlas.frames[phase] || atlas.frames.idle;
    G.setChibiFrame(m, dir8, info.startRow + (frame % info.count));
    var cam = G.camera.cam;
    if (cam) m.lookAt(cam.position.x, m.position.y, cam.position.z);
    add(m, 0.28, function (t, self) {
      self.material.opacity = 0.4 * (1 - t);
    });
  };

  // =====================================================================
  // 格挡光环
  // =====================================================================
  V.parryAura = function (x, z) {
    var geo = new THREE.RingGeometry(1.1, 1.45, 24);
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#E8C25A'),
      transparent: true, opacity: 0.65,
      side: THREE.DoubleSide, depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, V.atGround(x, z, 0.4), z);
    G.world.scene.add(m);
    // 持续到 parry 结束由 entity 管理，这里做视觉脉冲
    var life = 1.2;
    active.push({
      obj: m, life: life, maxLife: life,
      update: function (t, self) {
        self.material.opacity = 0.65 * (1 - t * 0.5);
        self.rotation.z += 0.06;
        self.position.x = G.player.state.x;
        self.position.z = G.player.state.z;
      }
    });
  };

  V.parryFlash = function (x, z, angle) {
    V.moonSlash(x, z, angle, 3.2);
    // 金色爆闪
    var geo = new THREE.SphereGeometry(1.2, 10, 8);
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#FFE9A8'),
      transparent: true, opacity: 0.9,
      depthWrite: false, blending: THREE.AdditiveBlending
    });
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x, V.atGround(x, z, 1.2), z);
    add(m, 0.25, function (t, self) {
      self.material.opacity = 0.9 * (1 - t);
      self.scale.setScalar(1 + t * 2.5);
    });
  };

  // =====================================================================
  // 伤害数字（DOM 覆盖层，字永远清楚）
  // =====================================================================
  V.damageNumber = function (x, y, z, value, opts) {
    opts = opts || {};
    var layer = G.ui && G.ui.damageLayer;
    if (!layer) return;
    var el = document.createElement('div');
    el.className = 'dmg' + (opts.crit ? ' crit' : '') + (opts.playerTaking ? ' taken' : '');
    el.textContent = opts.crit ? (value + '!') : String(value);
    layer.appendChild(el);
    damageNumbers.push({
      el: el, x: x, y: y, z: z,
      life: 0.9, maxLife: 0.9,
      vx: opts.playerTaking ? 0 : (Math.random() - 0.5) * 22,
      vy: -46 - Math.random() * 18,
      scale: opts.crit ? 1.5 : 1
    });
  };

  // =====================================================================
  // 升级 / 拾取 / 传送
  // =====================================================================
  V.levelUp = function (x, z) {
    for (var i = 0; i < 3; i++) {
      (function (k, delaySec) {
        delayed(delaySec, function () {
          if (!G.world.scene) return;
          var geo = new THREE.RingGeometry(0.6, 0.9, 20);
          var mat = new THREE.MeshBasicMaterial({
            color: new THREE.Color('#FFE9A8'),
            transparent: true, opacity: 0.85,
            side: THREE.DoubleSide, depthWrite: false,
            blending: THREE.AdditiveBlending
          });
          var m = new THREE.Mesh(geo, mat);
          m.rotation.x = -Math.PI / 2;
          m.position.set(x, V.atGround(x, z, 0.25 + k * 0.5), z);
          add(m, 0.6, function (t, self) {
            self.material.opacity = 0.85 * (1 - t);
            self.scale.setScalar(1 + t * 2.4);
          });
        });
      })(i, i * 0.1);
    }
    G.ui.toast('✦ 等级提升 ✦', 1800);
  };

  V.pickupBurst = function (x, z, color) {
    var n = 6;
    for (var i = 0; i < n; i++) {
      var geo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
      var mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(color || '#E8C25A'),
        transparent: true, opacity: 0.95, depthWrite: false
      });
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x, V.atGround(x, z, 1.0), z);
      var a = (i / n) * Math.PI * 2;
      var sp = 2.2 + Math.random() * 1.6;
      add(m, 0.5, (function (ang, s) {
        return function (t, self) {
          self.material.opacity = 0.95 * (1 - t);
          self.position.x = x + Math.cos(ang) * s * t * 0.9;
          self.position.z = z + Math.sin(ang) * s * t * 0.9;
          self.position.y = 1.0 + Math.sin(t * Math.PI) * 1.1 - t * 0.4;
          self.rotation.x += 0.2; self.rotation.y += 0.25;
        };
      })(a, sp));
    }
  };

  // =====================================================================
  // 每帧更新
  // =====================================================================
  V.update = function (dt) {
    // 3D 特效
    for (var i = active.length - 1; i >= 0; i--) {
      var a = active[i];

      // 延迟项：倒计时结束后执行一次创建回调，然后出队
      if (a.isDelay) {
        a.life -= dt;
        if (a.life <= 0) {
          active.splice(i, 1);
          try { a.delay(); } catch (e) { console.warn('[vfx] delayed callback failed', e); }
        }
        continue;
      }

      a.life -= dt;
      var t = 1 - Math.max(0, a.life) / a.maxLife;
      if (a.update) a.update(t, a.obj);
      if (a.life <= 0) {
        if (a.obj && a.obj.parent) a.obj.parent.remove(a.obj);
        if (a.obj && a.obj.geometry) a.obj.geometry.dispose();
        if (a.obj && a.obj.material) a.obj.material.dispose();
        active.splice(i, 1);
      }
    }

    // 伤害数字（DOM 定位）
    for (var j = damageNumbers.length - 1; j >= 0; j--) {
      var d = damageNumbers[j];
      d.life -= dt;
      var tt = 1 - Math.max(0, d.life) / d.maxLife;
      if (d.life <= 0) {
        if (d.el.parentNode) d.el.parentNode.removeChild(d.el);
        damageNumbers.splice(j, 1);
        continue;
      }
      var p = G.camera.worldToScreen(d.x, d.y + tt * 1.4, d.z);
      var scalePop = tt < 0.15 ? (0.6 + tt / 0.15 * 0.55) : 1.05;
      d.el.style.left = p.x + 'px';
      d.el.style.top = p.y + 'px';
      d.el.style.opacity = String(Math.max(0, 1 - tt * 1.1));
      d.el.style.transform = 'translate(-50%,-50%) scale(' + (scalePop * d.scale) + ')';
    }
  };

})(window.G = window.G || {});

</script>

<script>
/* 46-projectiles.js — 投射物
 */
(function (G) {
  'use strict';

  var M = G.M;
  var P = G.projectiles = { list: [] };

  P.clear = function () {
    for (var i = 0; i < P.list.length; i++) {
      var p = P.list[i];
      if (p.mesh && p.mesh.parent) p.mesh.parent.remove(p.mesh);
      if (p.mesh && p.mesh.geometry) p.mesh.geometry.dispose();
      if (p.mesh && p.mesh.material) p.mesh.material.dispose();
    }
    P.list.length = 0;
  };

  P.add = function (cfg) {
    var geo;
    var mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(cfg.color || '#FFFFFF'),
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    if (cfg.source === 'player') {
      // 气刃：细长的菱形
      geo = new THREE.OctahedronGeometry(cfg.radius || 0.4, 0);
    } else {
      // 敌方弹：球
      geo = new THREE.SphereGeometry(cfg.radius || 0.3, 6, 5);
    }
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(cfg.x, 1.0, cfg.z);
    mesh.scale.set(1, 1, cfg.source === 'player' ? 2.4 : 1);
    G.world.scene.add(mesh);

    var proj = {
      x: cfg.x, z: cfg.z,
      dirX: cfg.dirX, dirZ: cfg.dirZ,
      speed: cfg.speed, range: cfg.range,
      traveled: 0, radius: cfg.radius,
      damage: cfg.damage, source: cfg.source,
      pierce: cfg.pierce || 0,
      hit: cfg.hit || [],
      hitstopMs: cfg.hitstopMs || 0,
      crit: cfg.crit, critMult: cfg.critMult,
      color: cfg.color,
      mesh: mesh,
      dead: false
    };
    mat.blending = THREE.NormalBlending;

    // 拖尾
    var trailGeo = new THREE.PlaneGeometry(0.3, 1.4);
    var trailMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(cfg.color || '#FFFFFF'),
      transparent: true, opacity: 0.4,
      depthWrite: false, blending: THREE.AdditiveBlending
    });
    var trail = new THREE.Mesh(trailGeo, trailMat);
    trail.rotation.x = -Math.PI / 2;
    trail.position.y = 0.15;
    mesh.add(trail);
    proj.trail = trail;

    P.list.push(proj);
    return proj;
  };

  P.update = function (dt) {
    for (var i = P.list.length - 1; i >= 0; i--) {
      var p = P.list[i];
      if (p.dead) { P.destroy(p, i); continue; }

      var step = p.speed * dt;
      p.x += p.dirX * step;
      p.z += p.dirZ * step;
      p.traveled += step;

      p.mesh.position.x = p.x;
      p.mesh.position.z = p.z;
      // 朝向
      p.trail.rotation.z = Math.atan2(p.dirX, p.dirZ);
      p.mesh.rotation.y = Math.atan2(p.dirX, p.dirZ);

      // 碰撞
      if (p.source === 'player') {
        var list = G.enemy.list;
        for (var k = 0; k < list.length; k++) {
          var e = list[k];
          if (e.dead) continue;
          if (p.hit.indexOf(e.id) >= 0) continue;
          if (M.dist(p.x, p.z, e.x, e.z) < p.radius + e.radius) {
            var dmg = p.damage * (p.crit ? (p.critMult || 1.8) : 1);
            G.combat.hitEnemy(e, dmg, {
              crit: p.crit, element: 'blade',
              hitstopMs: p.hitstopMs,
              lifesteal: G.player.state.lifesteal
            });
            p.hit.push(e.id);
            if (p.hit.length > p.pierce) { p.dead = true; break; }
          }
        }
      } else {
        var st = G.player.state;
        if (!st.dead && M.dist(p.x, p.z, st.x, st.z) < p.radius + 0.4) {
          G.combat.hitPlayer(p.damage, p.x, p.z, { knockback: 0.8 });
          p.dead = true;
        }
      }

      // 超出射程
      if (p.traveled > p.range) p.dead = true;
      // 撞墙
      var res = G.world.resolveCollision(p.x, p.z, 0.1);
      if (M.dist(res.x, res.z, p.x, p.z) > 0.05) p.dead = true;

      if (p.dead) P.destroy(p, i);
    }
  };

  P.destroy = function (p, idx) {
    if (p.mesh && p.mesh.parent) p.mesh.parent.remove(p.mesh);
    if (p.mesh) {
      if (p.mesh.geometry) p.mesh.geometry.dispose();
      if (p.mesh.material) p.mesh.material.dispose();
    }
    P.list.splice(idx, 1);
  };

})(window.G = window.G || {});

</script>
