<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>chibi atlas preview</title>
<style>
  html,body{margin:0;background:#2b2b33;color:#eee;font:12px system-ui,sans-serif}
  #wrap{padding:10px}
  canvas{display:block;image-rendering:pixelated;margin-bottom:8px;background:#4a5560}
  h3{margin:6px 0 4px;font-weight:600;color:#F7C8D8}
  #err{color:#ff8080;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<div id="wrap"></div>
<script src="../vendor/three.min.js"></script>
<script src="../src/00-core.js"></script>
<script src="../src/11-pixels.js"></script>
<script src="../src/20-art-chibi.js"></script>
<script>
(function (G) {
  var wrap = document.getElementById('wrap');
  function fail(msg) {
    var e = document.createElement('pre');
    e.id = 'err';
    e.textContent = 'ERROR: ' + msg;
    wrap.appendChild(e);
    document.title = 'FAIL';
  }
  try {
    var looks = [
      { name: 'A hero (light indigo)', look: G.makeLook({}) },
      { name: 'B girl (sakura)', look: G.makeLook({
          kimono: '#F7C8D8', kimonoSh: '#D9A0B8',
          hair: '#6B4A3A', hairSh: '#4A3025',
          obi: '#7FB069', obiSh: '#5C8A4A' }) },
      { name: 'C elder (grey)', look: G.makeLook({
          kimono: '#C8C3B8', kimonoSh: '#9A968C',
          hair: '#D8D2C4', hairSh: '#B8B2A4',
          obi: '#9A968C', obiSh: '#7A766C' }) },
      { name: 'D enemy (dark red)', look: G.makeLook({
          kimono: '#A8302A', kimonoSh: '#7A1F1B',
          hair: '#2A1F26', hairSh: '#1A1216',
          obi: '#3A2E2A', obiSh: '#241A18',
          skin: '#C8A898', skinSh: '#A08478' }) }
    ];

    for (var i = 0; i < looks.length; i++) {
      var L = looks[i];
      var h = document.createElement('h3');
      h.textContent = L.name;
      wrap.appendChild(h);

      var atlas = G.buildChibiAtlas(L.look);
      var src = atlas.canvas;
      var scale = 4;
      var c = document.createElement('canvas');
      c.width = src.width * scale;
      c.height = src.height * scale;
      var ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(src, 0, 0, c.width, c.height);
      wrap.appendChild(c);
    }
    document.title = 'OK ' + looks.length;
    window.__ATLAS_READY__ = true;
  } catch (e) {
    fail(e.message + ' | ' + (e.stack || ''));
  }
})(window.G = window.G || {});
</script>
</body>
</html>
